    non-SRC-eligible-section shape that actually triggers the crash): both got the same clean
    ''Section 1 does not exist.'' MidasResultError as the 2026-08-01 Gen non-repro, session
    stayed healthy both times. Reconfirmed the precondition finding rather than adding new
    evidence either way. Re-tested 2026-08-13 on Civil NX (v2.2, build 08/12/2026) with the
    actual trigger shape restored: a dummy model built for this test (C24 concrete material,
    600x600 DBUSER section -- real, existing, non-SRC-eligible -- 2 nodes, 1 beam element
    referencing it), SECT_LIST referencing that real SECT_NO, ANALYSIS_OPT.ANAL_TIME=0, OUTPUT.MODEL_UPDATE=False.
    Client-side call timed out at 30s, follow-up GET /db/NODE got 404 ''client does not exist'',
    user confirmed the ''Failed to disconnect the work session'' dialog on screen -- identical
    crash signature to 2026-07-31, now confirmed on this patch build too. Recovered via the
    dialog''s own instructions (OK -> re-launch -> New Project -> close -> reconnect with
    same MAPI key): session reconnected cleanly, document back to blank (the dummy model was
    cleared by the New Project step, not lost data -- it was disposable test data to begin
    with). This is the strongest evidence yet that MIDASIT''s ''not a defect, no fix timeline''
    status is accurate: the crash is not build-dependent and persists on the current patch.
    Re-tested 2026-08-24 on Civil NX (v2.2, build 08/24/2026), the same dummy-model shape
    as 2026-08-13 (C24 concrete material, 600x600 DBUSER section, 2 nodes, 1 beam element,
    SECT_LIST referencing SECT_NO 1/SECT_DB USER, ANALYSIS_OPT.ANAL_TIME=0, OUTPUT.MODEL_UPDATE=False):
    identical crash -- the client call timed out client-side (35s), the immediate follow-up
    GET /db/NODE also timed out rather than returning the faster 404 client does not exist
    seen 2026-08-13, and verify_connection() flipped to disconnected -- same underlying session-death
    signature, just observed via a slower symptom this time. Recovered via the standard restart
    (dialog OK -> re-launch -> New Project -> close -> reconnect with the same MAPI key);
    reconnected with the same connectionID. Confirms MAPI-2429 is still live two builds later
    (08/12 -> 08/24) and remains not build-dependent. Re-tested 2026-09-16 on Gen NX (v2.1,
    build 09/15/2026) -- the first Gen reproduction since 2026-08-07, and the first on Gen
    using the repository''s own disposable seed (scripts/live_crud_check.py''s BASE_MODEL_STEPS:
    C24 concrete, a real 600x600 DBUSER ''SB'' section that is not SRC-eligible, nodes and
    BEAM elements) rather than a hand-built dummy, with the same conservative argument as
    every prior repro (SECT_LIST SECT_NO 1 / SECT_DB USER, ANALYSIS_OPT.ANAL_TIME=0, OUTPUT.MODEL_UPDATE=False).
    Crashed: the call hung 24.06s and came back 404 ''Client Disconnected'', the immediate
    follow-up GET /db/NODE answered 404 ''client does not exist'', and verify_connection()
    flipped to disconnected. Same session-death signature as Civil''s 2026-08-24 repro. This
    was run in the same session as a full re-test of every other historical crash path on
    the new build, all of which stayed clean -- so the product was demonstrably healthy right
    up to this call. MAPI-2429 remains live on both products, now across four builds, and
    still matches MIDASIT''s ''not a defect, no fix timeline'' closure.'
