# The live-evidence ledger: what a real Gen NX / Civil NX session proved.
#
# One record per session finding; `endpoints` names everything that finding
# covers. Resolved per endpoint by scripts/verification_ledger.py, which is
# what ROADMAP.md and every published coverage count read.
#
# `level` means what a session ACHIEVED, never what it attempted:
#   write  a call mutated model data, or wrote a file on the NX host
#   read   everything else that answered, including a refused write
#
# Re-verifying an endpoint adds a record. Do not edit an existing record's
# date, build or level to mean "and again later" - that loses the session the
# claim came from, which is the mistake this file replaced.
#
# Migrated 2026-09-21 from docs/coverage.json's per-endpoint live_verified
# blocks; each record below carries the prose that field had accreted, under
# `method`. Records written before the migration keep their own ids in
# contracts/verification/{gen,civil}-nx.yaml, which holds session findings
# that endpoint contracts cite for provenance.

