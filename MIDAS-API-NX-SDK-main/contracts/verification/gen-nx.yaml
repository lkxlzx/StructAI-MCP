  - id: db-rebw-live-shape-2026-07-29
    endpoints: ["/db/REBW"]
    date: "2026-07-29"
    nxVersion: MIDAS Gen NX 2026 (v2.1), build 07/28/2026
    level: write
    outcome: success
    method: >-
      Against a real production Gen NX model - a KDS/Korean-code building,
      4044 nodes, 4686 elements, with 102 populated wall-rebar rows - not a
      scratch document. Three independent checks: GET /db/REBW read back, GET
      /info/db/REBW pulled for the server's own Argument schema, and a PUT
      round trip on wall 101 that backed up the record, changed VER_BAR.DIST
      from 0.2 to 0.99, confirmed the change on a fresh GET, then restored the
      original and confirmed the restore byte-for-byte. No /doc/NEW was called;
      nothing in the model was left changed.
    finding: >-
      Every field name in the manual's Specifications table and JSON Schema is
      wrong for this endpoint. The server answers to ID, bUSE_MODEL_THICK,
      THICK, top-level DW and DE, VER_BAR, HOR_BAR, END_BAR, NUM_END_BAR,
      BE_HOR_BAR, BE_LENGTH and vSTORY_NAME. Two differences are structural:
      the rebar-centre distances are top-level rather than members of a
      CONCRETE_FACE_TO_CENTER_OF_REBAR object, and stories are a flat name list
      rather than a {FROM, TO} range. The PUT is what makes these the write
      contract and not only the read shape. /db/REBB in the same chapter and
      /DESIGN/RC/KDS-41-20-2022/REBW - the same 102 walls - both matched their
      own documentation exactly in this session, isolating the defect to one
      manual section. MIDASIT's own Zendesk article 59359110968345 carries the
      same wrong names, so the vendored chapter transcribes its source
      faithfully and the source is what disagrees with the product.
    evidence:
      - docs/live_verification_notes.md

  - id: db-rebc-live-shape-2026-08-27
    endpoints: ["/db/REBC"]
    date: "2026-08-27"
    nxVersion: MIDAS Gen NX 2026 (v2.1), build 08/20/2026
    level: write
    outcome: success
    method: >-
      A comparison rather than a single check, because three sources disagreed.
      Both candidate payload shapes were POSTed to the same Gen NX session -
      the single-object MAIN_BAR form that MIDASIT's Zendesk article 
      49513980544793 documents, and the vMAIN_BAR array form. Then a full
      POST -> GET -> PUT -> DELETE -> GET round trip on the shape that was
      accepted, and a fresh GET /info/db/REBC pulled field for field.
    finding: >-
      The documented single-object shape answers "Wrong Field" - rejected
      outright. The array shape answers "Column Rebars has been entered in the
      section no. 1, which has not been specified", a domain error, which means
      the shape itself was accepted and only the target section was missing.
      That distinction is what settled it. The round trip then confirmed full
      CRUD including a DELETE that actually removes the record, contradicting
      the chapter's POST-only callout, and GET /db/REBC answers cleanly on its
      own. /info confirmed every field name plus HOOK_TYPE, which the SDK was
      missing. The official article carries the same wrong shape as the
      vendored chapter, so the defect is upstream of the manual repo.
    evidence:
      - docs/live_verification_notes.md

  - id: db-rebb-write-path-2026-08-27
    endpoints: ["/db/REBB"]
    date: "2026-08-27"
    nxVersion: MIDAS Gen NX 2026 (v2.1), build 06/23/2026
    level: read
    outcome: success
    method: >-
      A real target was built from scratch for this specifically - a C24
      concrete MATL, a SECT with SHAPE "SB" following live_crud_check.py's
      confirmed fixture pattern, a beam ELEM using it, and a DCON design code -
      then POST /db/REBB was retried with this SDK's shape, the official
      Zendesk article's own embedded JSON Schema block (LAYER1/LAYER2, DT/DB,
      additionalProperties false), mixtures of the two, and a literally empty
      item. GET /info/db/REBB was pulled field for field in the same session.
      All fixtures were cleaned up afterwards.
    finding: >-
      Every write answered "Wrong Field", the empty item included - which rules
      out the request body, since an empty object cannot contain a wrong field.
      verify_connection() reported connected rather than a blocked-modal false
      positive and an unrelated GET /db/NODE succeeded, so the session was
      fine. Recorded as risk db-rebb-write-path-refuses-every-payload, the same
      class as /db/NLLP and /db/WVLD. The /info schema is what the field names
      rest on: vMAIN_BAR_TOP/BOT arrays of {NAME, NUM} inside BAR_SECTOR_I/M/J,
      flat SKIN_BAR_NAME/NUM, MAIN_BAR_DC_TOP/BOT, three undocumented
      bSAME_SIZE_* flags, and no CREATE_SUB_SECTION or ELEMS. It agrees with
      the section's own worked example and disagrees with its parameter table,
      and the official article contradicts itself the same way in one document.
      The level stays read: nothing was written, because nothing could be.
    riskRef: db-rebb-write-path-refuses-every-payload
    evidence:
      - docs/live_verification_notes.md

