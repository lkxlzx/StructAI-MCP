# Live verification records for MIDAS Civil NX.
#
# One entry per observed session finding. Endpoint contracts reference these by
# id through `verification.records[].ref`. Prose narrative stays in
# docs/live_verification_notes.md; this file carries only what a machine needs
# to check that a claim has a dated, product-specific, build-specific source.
