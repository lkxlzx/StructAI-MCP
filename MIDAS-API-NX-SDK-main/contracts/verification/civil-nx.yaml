  - id: mvhl-load-num-branches-2026-09-03
    endpoints: ["/db/MVHL"]
    date: "2026-09-03"
    nxVersion: >-
      unknown - MIDAS Civil NX 2026 (v2.2), build string not readable through the
      API, and this session predates the 09/02/2026 patch installed on
      2026-09-03. /mapikey/verify returns only the program name and no /doc
      route serves a version, so the build is left unstated rather than
      guessed - including backwards from the About dialog of a build that was
      not yet installed when this ran.
    level: write
    outcome: success
    method: >-
      Against a document confirmed empty first, seeded only with
      /db/MVCD CODE "AASHTO LRFD" and cleaned up by id afterwards; no /doc/NEW.
      The standard payload is live_crud_check.py's confirmed HL-93TRK fixture;
      the user-defined one follows the chapter's own User Defined example moved
      onto AASHTO-LRFD's VEH_DEFAULT/LOAD_ITEMS pair. VEHICLE_LOAD_NUM was
      varied across 1, 2, 3 and omission, then each branch's companion fields
      were omitted one shape at a time.
    finding: >-
      VEHICLE_LOAD_NUM is the branch discriminator: 1 selects a standard DB
      vehicle and 2 a user-defined one; 3 and omission both answer Wrong Field.
      Branch 2 sent properly keeps every field, all three axle loads included,
      so the 2026-07-26 "silent downgrade" was branch 2 ignoring branch 1's
      fields - the documented contract, not a defect, and that reading is
      retracted. VEHICLE_TYPE_NAME is required only under branch 1 and is not
      validated at all ("NOT-A-VEHICLE" stored verbatim); STANDARD_CODE is
      required under neither, is enum-checked ("NOT-A-CODE" answers Wrong
      Field) but not cross-checked against the vehicle ("KS-RB" stored on an
      AASHTO LRFD HL-93TRK); USER_LOAD_TYPE is ignored on input under
      MVLD_CODE 2. The server also renumbers a POSTed record. Registered as
      MD-16.
    evidence:
      - docs/live_verification_notes.md

