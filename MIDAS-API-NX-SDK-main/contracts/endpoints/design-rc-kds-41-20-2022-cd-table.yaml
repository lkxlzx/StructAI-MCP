manualDefects:
  - describes: requiredness
    manualSays: >-
      Rows 3 and 4 mark `ELEMS` and `SECTIONS` 조건부 and state no condition for
      either. The `ELEMS` row carries only 요소 지정 - `KEYS`/`TO`/
      `STRUCTURE_GROUP_NAME` 중 하나, which is `ELEMS`'s internal shape, not a
      requiredness condition; the `SECTIONS` row says nothing. This section's own
      JSON Schema has `required: ["TABLE_TYPE"]` and no branch keyword.
    actual: >-
      They are alternatives: exactly one of the two. Chapter 26 states this for
      the same field pair in seven of the nine BD/CD/BRD sections - BD-ANAL,
      BD-TABLE, BD-REPORT, CD-ANAL, CD-REPORT, BRD-ANAL and BRD-REPORT - writing
      `ELEMS`/`SECTIONS` 중 하나 in the row and carrying a JSON Schema `oneOf` of
      `{"required": ["ELEMS"], "not": {"required": ["SECTIONS"]}}` against its
      mirror. `CD-TABLE` and `BRD-TABLE` are the only two with neither, including
      against their own `-ANAL` and `-REPORT` companions, which take the same
      pair. Recorded `conditional` with that phrase and **no** `appliesWhen`: the
      manual names no discriminator field, because which one to send is the
      caller's choice. Same shape as MD-28.
    evidence: >-
      docs/manual/26_Design_RC_KDS41202022.md sections 43 and 46, rows 3 and 4 and
      their JSON Schemas, against the same rows and schemas in sections 39, 40,
      41, 42, 44, 45 and 47. Registered as MD-33.

