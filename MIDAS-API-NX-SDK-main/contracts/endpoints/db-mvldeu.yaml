sdkRules:
  - id: db-mvldeu-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-mvldeu-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

manualDefects:
  - describes: field_value
    manualSays: >-
      The Specifications table types `OPT_COMB` as `String`, in the same row
      whose description gives its two values as `0` and `1`.
    actual: >-
      An integer. Both of the section's Request Body examples that set it send
      `"OPT_COMB": 1` unquoted. Same family as MD-11: a Value Type column its
      own section contradicts.
    evidence: >-
      docs/manual/08_DB_Moving_Loads.md, the row at line 2087 read against the
      Request Body examples at lines 1957 and 2027. Registered as MD-25.
  - describes: field_name
    manualSays: >-
      `STL_LIST` and `SUB_LOAD_LIST` are typed `Array[Object]` with no member
      rows of their own; their members are named only inside the parent row's
      description, as `(1)` Start Lane `"NAME1"`, `(2)` End Lane `"NAME2"` and
      the six keys of a sub-load case.
    actual: >-
      Both are objects with the members the description names, in that order,
      and the section's Request Body examples send them literally -
      `{"NAME1": "LL_03", "NAME2": "LL_04"}` and a sub-load case carrying all
      six. The numbering is the same convention this chapter uses in rows of
      its own elsewhere; here it is compressed into one cell. Transcribed as
      nested `properties` so the published payload type keeps describing them,
      which it did before this endpoint was contracted.
    evidence: >-
      docs/manual/08_DB_Moving_Loads.md rows 11 and 13 at lines 2086 and 2088,
      read against the Request Body examples at lines 1959 and 2009.
      Registered as MD-25.

extraction:
  prose:
    - line: 2096
      quote: >-
        Sub-Load Cases for Optimization - (1) Type "TYPE", (2) Name "NAME", (3) Scale Factor "SCALE_FACTOR"
      paths: [OPTIMIZE_LIST.TYPE, OPTIMIZE_LIST.NAME, OPTIMIZE_LIST.SCALE_FACTOR]
  source: 08_DB_Moving_Loads.md line 2073
  table: Parameters
