# /db/SPLC
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-splc
endpoint: /db/SPLC
name: Response Spectrum Load Cases
surface:
  className: ResponseSpectrumLoadCase
  exportName: responseSpectrumLoadCase
  modulePath: [db, dynamicLoads]
  payloadTypeName: ResponseSpectrumLoadCasePayload
  nestedTypes:
    - {path: aUSEMODE, name: ResponseSpectrumUseMode, namespace: DbDynamicLoadsTypes}

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 09_DB_Dynamic_Loads.md
    section: 2. /db/SPLC – Response Spectrum Load Cases
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_civil
  records:
    - product: civil
      ref: db-write-sweep-2026-09-01

operations:
  - method: DELETE
    variant: per_id
    path: /db/SPLC/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      `aACCECC_ECCEN_LIST[].ALONG` is created but not updated. Live on Gen,
      Build 09/15/2026: a POST stored 2.5, a following PUT echoed 3.5, and the
      GET after it still returned 2.5. The accidental-eccentricity table is
      unmerged, so the contract publishes no member to carry this; it is
      recorded here because a PUT that reports success and changes nothing is
      not something a caller can see.

