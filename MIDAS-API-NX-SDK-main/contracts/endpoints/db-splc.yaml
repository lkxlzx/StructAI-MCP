manualDefects:
  - describes: requiredness
    manualSays: >-
      The accidental-eccentricity table marks rows 25-29 (bACCECC_AUTO,
      ACCECC_PERCENT, bACCECC_CONSIDER_GL, bACCECC_MINIMUM_TORSION,
      aACCECC_ECCEN_LIST) Required, and the non-dissipative table marks NDP
      Required, each directly under the Boolean that turns the feature on and
      with no condition.
    actual: >-
      None of them is required. With bACCECC left at its default a confirmed
      round trip omits all five; with bACCECC=true and all five omitted the
      POST is accepted and the record reads back with bACCECC_AUTO,
      bACCECC_CONSIDER_GL and bACCECC_MINIMUM_TORSION supplied by the server.
      bNDP=true without NDP is accepted too.
    evidence: >-
      scripts/live_manual_feedback.py --case c1 on Gen NX, 2026-09-22, and the
      confirmed /db/SPLC case in scripts/live_crud_check.py; recorded in
      docs/live_verification_notes.md and as MD-57 in
      docs/manual_defects_register.md.

sdkRules:
  - id: db-splc-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-splc-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

