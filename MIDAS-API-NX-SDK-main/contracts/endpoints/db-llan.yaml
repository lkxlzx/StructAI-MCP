        | AASHTO LRFD | `"ECC"`, `"SPAN_START"`, `"CENT_F"` |
        ECC·경간시작·원심력계수 |
      paths: [LANE_ITEMS.ECC, LANE_ITEMS.SPAN_START, LANE_ITEMS.CENT_F]
