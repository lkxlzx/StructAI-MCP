manualDefects:
  - describes: requiredness
    manualSays: >-
      The Unequal and ParametricUnequal rows mark `DIST_X/Y/Z` and
      `RATIO_X/Y/Z` Required with no condition. The Equal row beside them
      states which axes each element type divides along (Frame=X만,
      Planar=X,Y, Wall=X,Z, Solid=X,Y,Z), and the section's own Planar
      Unequal Request Body sends X and Y only.
    actual: >-
      The Equal row's axes hold for the other two methods. A Frame element
      divides with `DIST_X` alone and with `RATIO_X` alone; a Planar element
      divides with `RATIO_X` and `RATIO_Y` and answers `Unknown Error` with
      `RATIO_X` alone. Identical on both products. Wall and Solid were not
      measured and follow the Equal row.
    evidence: >-
      docs/live_verification_notes.md, "/ope/DIVIDEELEM: the Equal row's axes
      hold for every method" (2026-09-22): scripts/live_manual_feedback.py case
      c8 on Civil NX and Gen NX, each body in its own seeded document, the
      element table read before and after. Registered as MD-62.

