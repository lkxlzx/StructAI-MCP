manualDefects:
  - describes: field_name
    manualSays: >-
      /db/LLANop's record is a flat record and `LANE_ITEMS`.
    actual: >-
      `GET /info/db/LLANop` declares a further property,
      `SPECIAL_LANE_ITEMS`, an array of {`CENT_F`, `ECC`, `ELEMS`, `FACT`,
      `SCALE_FACTOR`, `SPAN`, `SPAN_START`, `SPAN_START_NO_LIST`} described
      " Used only when importing". That description is the whole of what is
      known about when it applies; no contract rule is written from it. The
      name appears nowhere in the manual - the whole repo was searched, not
      just this section. The same section also omits the root `OPT_STRADD`
      (Use Straddling Lane Type), which /info declares here and on
      /db/SLANop, where it is already registered as MD-45.
    evidence: >-
      GET /info/db/LLANop on Civil NX, captured 2026-09-03, against
      docs/manual/08_DB_Moving_Loads.md. The same undocumented array is on
      /db/LLANtr, where it was first registered as MD-45; this is that
      finding reaching its siblings.
sdkRules:
  - id: db-llanop-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-llanop-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

