manualDefects:
  - describes: field_name
    manualSays: >-
      /db/STOR's JSON Schema, Request Example and Specifications table
      each give the same fifteen properties and stop.
    actual: >-
      There is a sixteenth: `STORY_AREA_ITEMS`, an array of `{X, Y, Z}`
      factors. The manual does document it, in another chapter -
      /ope/STOR's POST response in 15_OPE.md is this record field for
      field with the array added, and the prose under it names it: 층 면적 좌표
      목록(STORY_AREA_ITEMS). So this is an incompleteness rather than a
      contradiction, and the contract takes the field from the manual,
      with /info agreeing member for member.
    evidence: >-
      Found by scripts/info_baseline.py --against-contracts on 2026-09-04,
      sweeping the 2026-09-03 /info capture against every contract. The
      manual was then searched in full for the name, not just this
      section. docs/manual/02_DB_Project_Structure.md section 15 against
      docs/manual/15_OPE.md's /ope/STOR. Registered as MD-39.

sdkRules:
  - id: db-stor-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-stor-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 02_DB_Project_Structure.md line 1328
  table: Specifications
