# /db/STOR
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products, verification status and the DELETE
# shape come from docs/coverage.json's live record and the measured /db/* DELETE
# behaviour, not from the manual's framing. safeToOmit is answered `true` only
# where a confirmed live payload actually omitted the field.
contractVersion: 1
id: db-stor
endpoint: /db/STOR
name: Story Data
surface:
  className: Story
  exportName: story
  modulePath: [db, project]
  payloadTypeName: StoryPayload
  nestedTypes:
    - {path: STORY_AREA_ITEMS, name: StoryAreaItem, namespace: DbProjectTypes}

products: [gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 02_DB_Project_Structure.md
    section: "15. `/db/STOR` — Story Data"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_gen
  records:
    - product: gen
      ref: db-write-sweep-2026-08-13

operations:
  - method: DELETE
    variant: per_id
    path: /db/STOR/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

