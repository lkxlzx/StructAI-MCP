# /db/FIMP
#
# The largest contract here, and the one where the manual says outright that it
# is not transcribing its source. Its own callout puts the reason plainly: the
# official article is over 5900 lines covering seventeen hysteresis models, and
# the chapter details Kent & Park alone, keeping only the fact that the others
# exist as MATL_TYPE / HYS_MODEL combinations.
#
# So the shape here comes from GET /info/db/FIMP, which both products serve
# identically, and the manual supplies what /info cannot: the three top-level
# fields' requiredness, the two MATL_TYPE values, and every requiredness inside
# Kent & Park. Nothing else is claimed. Which HYS_MODEL value selects which of
# the seventeen objects is documented for exactly one of them.
contractVersion: 1
id: db-fimp
endpoint: /db/FIMP
name: Inelastic Material Properties
surface:
  className: InelasticMaterialProperty
  exportName: inelasticMaterialProperty
  modulePath: [db, properties, material]
  payloadTypeName: InelasticMaterialPropertyPayload

products: [civil, gen]
productsEvidence: >-
  Both. GET /info/db/FIMP answers on Civil NX and Gen NX and the two schemas
  are byte-identical, captured 2026-09-01 in schema/info-schemas.json.

recordKey:
  kind: record_id
  description: The material id, as the section's Request Body uses it.

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 04_DB_Properties.md
    section: "28. `/db/FIMP`"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: info-schema-sweep-2026-09-01
    - product: gen
      ref: info-schema-sweep-2026-09-01

operations:
  - method: DELETE
    variant: per_id
    path: /db/FIMP/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Nobody has written to this endpoint through either SDK. The field names
      below come from the server's own schema, which is a strong source for
      what it accepts and no source at all for which combinations of MATL_TYPE,
      HYS_MODEL and model object it accepts together.
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: NAME
    description: >-
      Material Name
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: live_verified
  - key: MATL_TYPE
    description: >-
      Material Type - Concrete: "CONC" / Steel: "STEEL"
    type: string
    enum: [CONC, STEEL]
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: live_verified
    enumNote: >-
      The manual states both values in the row itself. They name the two
      objects below, so this field says which of `CONC` and `STEEL` a
      record fills in.
  - key: HYS_MODEL
    description: >-
      Hysteresis Model
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: live_verified
    provenanceNote: >-
      Manual and /info agree on the name, the type and that it is required.
      Neither states the value set. The manual gives exactly one value,
      `"KPM"` for Kent & Park, in the heading of the one model table it
      chose to detail; /info declares no enum. So none is recorded here -
      seventeen model objects sit below and only one has a documented
      selector, and inventing the other sixteen from the object keys would
      be a guess about the wire rather than a transcription.
  - key: CONC
    description: >-
      Concrete Model
    type: object
    requirement: unstated
    documentedDefault: null
    documentedOptional: null
    safeToOmit: unverified
    provenance: info_schema
    provenanceNote: >-
      Named as an object by the section's own JSON Schema block and by its
      Request Body, and absent from its Specifications table - which is the
      MD-07 defect. Its members are the concrete hysteresis models, one
      object each; a record fills in the one `HYS_MODEL` selects.
