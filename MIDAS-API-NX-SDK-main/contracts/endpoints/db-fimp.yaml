manualDefects:
  - describes: field_name
    manualSays: >-
      The Kent & Park table keys its nine rows `"KENPAR"."FC"`,
      `"KENPAR"."PARTIAL_FACT"` and so on, and the Specifications table above
      it lists only `NAME`, `MATL_TYPE` and `HYS_MODEL` - naming neither `CONC`
      nor `STEEL`.
    actual: >-
      Those rows are three levels deep, not two: the Request Body in the same
      section sends `CONC` > `KENPAR` > `FC`. A dotted key names the immediate
      parent and silently drops the one above it, so a table read on its own
      puts `KENPAR` at the top of the record. The section's own JSON Schema
      block does declare `CONC` and `STEEL` as objects, so the chapter carries
      the missing level - just not in the table a caller reads for the field
      list.
    evidence: >-
      The section's own JSON Schema block and Request Body, 04_DB_Properties.md
      section 28, against GET /info/db/FIMP captured 2026-09-01. Registered as
      MD-07.
  - describes: behaviour
    manualSays: >-
      A callout states that the official article runs past 5900 lines across
      the concrete and steel model families, that this chapter details Kent &
      Park as the representative model, and that the rest are recorded only as
      existing `MATL_TYPE` / `HYS_MODEL` combinations.
    actual: >-
      Recorded not as a fault but as the reason this contract's other source is
      the server. The chapter is accurate about its own coverage, and a reader
      who takes its field list for the endpoint's field list gets one model out
      of seventeen. /info supplies the other sixteen object shapes; it supplies
      no requiredness for any of them, and no mapping from a `HYS_MODEL` value
      to the object it selects. Both gaps are left open here rather than
      guessed.
    evidence: >-
      04_DB_Properties.md section 28's own callout, and GET /info/db/FIMP.

sdkRules:
  - id: db-fimp-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-fimp-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog. An inelastic material is referenced by the fibre
      sections built on it, so losing the table silently invalidates them too.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 04_DB_Properties.md line 2089
  table: Specifications
  note: >-
    The Specifications table gives three fields and stops, by the chapter's own
    declared choice. The rest of the field tree was written from GET
    /info/db/FIMP with scripts/contract_from_info.py's renderer, then the
    manual's claims were laid back over the parts it does cover: NAME,
    MATL_TYPE and HYS_MODEL as Required, MATL_TYPE's two values, and the nine
    Kent & Park rows the manual marks Required. Everything else is `unstated`,
    because /info declares no required array and reading its silence as
    Optional would be a claim nobody has made.
