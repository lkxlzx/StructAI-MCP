          Kent & Park model parameters
        type: object
        requirement: unstated
        documentedDefault: null
        documentedOptional: null
        safeToOmit: unverified
        provenance: info_schema
        provenanceNote: >-
          The one model the manual transcribes in full, and the only place in
          this contract where a requiredness comes from the manual rather than
          from silence. Its table keys every row `"KENPAR"."FC"`, naming the
