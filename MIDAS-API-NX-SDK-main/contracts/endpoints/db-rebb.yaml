verification:
  status: verified_gen
  records:
    - product: gen
      ref: db-rebb-write-path-2026-08-27

operations:
  - method: DELETE
    variant: per_id
    path: /db/REBB/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Works. It is the only method here anyone has seen succeed, and it is
      where the field names below were corroborated against real data.
  - method: POST
    risk: write
    mitigation: none
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Not known to work. Every payload tried on 2026-08-27 - this shape, the
      official article's own embedded schema, and an empty item - answered
      `Wrong Field` against a real target section built for the test. See risk
      db-rebb-write-path-refuses-every-payload. The fields below are therefore
      the read contract, corroborated by /info, and nobody has confirmed them
      on the write path.
  - method: PUT
    risk: write
    mitigation: none
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
    notes: Same standing failure as POST.

