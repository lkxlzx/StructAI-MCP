products: [gen]
productsEvidence: >-
  Gen only. Both the route and GET /info/db/REBB 404 on Civil NX, confirmed
  independently twice on 2026-07-29. Recorded in db/base.py's GEN_ONLY.

recordKey:
  kind: record_id
  description: The section number, as the manual states.

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 24_DB_Design.md
    section: "10. `/db/REBB` — Modify Beam Rebar Data (보 철근 데이터 수정)"
  liveNotes:
