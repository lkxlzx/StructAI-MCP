manualDefects:
  - describes: field_name
    manualSays: >-
      The sector object holds `MAIN_BAR_TOP` and `MAIN_BAR_BOT` objects, each
      with `LAYER1` and an optional `LAYER2`, and a `SKIN_BAR` object with
      `NAME` and `NUM`. Two `ITEMS` rows are keyed `DT` and `DB`, and the entry
      table opens with `CREATE_SUB_SECTION`, backed by its own conditional
      table declaring `ID` and `ELEMS`.
    actual: >-
      The server declares `vMAIN_BAR_TOP` and `vMAIN_BAR_BOT` arrays of
      `{NAME, NUM}` - the position in the list is the layer, which is what its
      "size = 1 or 2" description means - flat `SKIN_BAR_NAME` and
      `SKIN_BAR_NUM`, and `MAIN_BAR_DC_TOP` / `MAIN_BAR_DC_BOT`.
      `CREATE_SUB_SECTION` and `ELEMS` are absent entirely, and three
      undocumented booleans are present: `bSAME_SIZE_TOP_BOT`,
      `bSAME_SIZE_IMJ`, `bSAME_SIZE_LAYER`.
    evidence: >-
      GET /info/db/REBB, pulled 2026-08-27 and captured in
      schema/info-schemas.json, agreeing with the section's own Request /
      Response example. docs/live_verification_notes.md, "the sibling manual
      repo reverted its own REBB/REBC/REBW re-verification, and got 2 of 3
      wrong".
    reportedToVendor: B-5
  - describes: behaviour
    manualSays: >-
      The vendored chapter flags the disagreement itself: two parameter rows
      carry the example's spelling in the same cell, and a 참고 note under the
      tables says the example form is the safe one to send.
    actual: >-
      Recorded because it is the honest half of this endpoint's story. The
      contradiction is in MIDASIT's own article, whose embedded JSON Schema
      block - `LAYER1`/`LAYER2`, `DT`/`DB`, `additionalProperties: false` -
      disagrees with its own Request / Response example in the same document.
      The vendored chapter transcribes both and tells the reader which to
      follow, and the one it picks is the one the server's schema agrees with.
      So this is not a transcription defect: the manual repo has already done
      what it can, and the correction is MIDASIT's to make.
    evidence: >-
      The article's raw HTML fetched directly on 2026-08-27, recorded in
      docs/live_verification_notes.md.
    reportedToVendor: B-5

sdkRules:
  - id: db-rebb-write-path-unconfirmed
    kind: warn
    appliesTo: [POST, PUT]
    reason: >-
      No write to this endpoint has ever been seen to succeed. On 2026-08-27,
      against a purpose-built target - a C24 material, an SB section, a beam
      element using it and a design code - every payload tried answered
      `Wrong Field`: this shape, the official article's own embedded schema,
      and a literally empty item. The empty item is the deciding one, because
      it fails the same way a full one does, so the cause is not the request
      body. A caller who gets `Wrong Field` here should not spend a session
      permuting field names, which is exactly what happened before the empty
      item was tried.
    riskRef: db-rebb-write-path-refuses-every-payload
    alternative: >-
      Read the current rebar with GET, which works. For writing, the ch26
      sibling /DESIGN/RC/KDS-41-20-2022/REBB is a separate endpoint that was
      not part of this failure.
  - id: db-rebb-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-rebb-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog. Beam rebar is design input a caller cannot
      reconstruct from the model geometry - and with the write path refusing
      everything, it could not be put back through this endpoint either.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table
  - ref: db-rebb-write-path-refuses-every-payload

