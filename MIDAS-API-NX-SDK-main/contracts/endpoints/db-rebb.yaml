# /db/REBB
#
# Contracted from the server's own schema and from the manual's worked example,
# which agree with each other and disagree with the manual's parameter table.
# The vendored chapter is unusually honest about this: its table annotates two
# of its own keys with the example's different spelling, and a 참고 note under
# it says to follow the example. So this is not a chapter transcribing its
# source badly - the source contradicts itself, and the chapter says so.
#
# What no source can settle is whether any of it is writable. Every POST tried
# on 2026-08-27 against a purpose-built target answered `Wrong Field`, including
# a literally empty item - which is what rules out the payload as the cause.
# See risk db-rebb-write-path-refuses-every-payload.
