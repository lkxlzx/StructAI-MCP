manualDefects:
  - describes: field_name
    manualSays: >-
      `MBAR_ITEMS` is a root property of the record, listed as row 5 beside
      `SBAR_ITEMS` as row 4, both `Array[Object]` and both described as
      "Array, Index 0=i-section / 1=j-section".
    actual: >-
      `GET /info/db/RPSC` declares five root properties - `MBARS`,
      `OPT_CRACKED`, `OPT_MBAR_J`, `OPT_SBAR_J`, `SBAR_ITEMS`. `SBAR_ITEMS` is
      at the root as documented; `MBAR_ITEMS` is not, and lives inside `MBARS`,
      an array the section never mentions. The members of `MBAR_ITEMS` are the
      nine the manual gives, unchanged - only its depth is wrong.
    evidence: >-
      GET /info/db/RPSC on Gen NX and Civil NX, captured 2026-09-03 in the full
      /info sweep, against docs/manual/04_DB_Properties.md section 16. The
      section was itself rewritten on 2026-08-25 to add MBAR_ITEMS, which had
      been missing entirely; the correction restored the fields and placed them
      at the wrong depth. Registered as MD-40.

sdkRules:
  - id: db-rpsc-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-rpsc-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

