# /db/STCT
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-stct
endpoint: /db/STCT
name: Construction Stage Analysis Control Data
surface:
  className: ConstructionStageAnalysisControlData
  exportName: constructionStageAnalysisControlData
  modulePath: [db, analysisControl]
  payloadTypeName: ConstructionStageAnalysisControlDataPayload

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 12_DB_Analysis_Control.md
    section: 17. /db/STCT — Construction Stage Analysis Control Data
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-read-sweep-2026-08-17
    - product: gen
      ref: db-read-sweep-2026-08-17

operations:
  - method: DELETE
    variant: per_id
    path: /db/STCT/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

