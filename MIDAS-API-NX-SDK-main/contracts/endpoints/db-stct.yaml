manualDefects:
  - describes: requiredness
    manualSays: >-
      The Erection Load table marks vSDLE (row 9, Load Case Name List for Grid
      Analysis Load, JP edition only) Required, with no condition, directly
      under row 8's bSDLE (default false).
    actual: >-
      A record without bSDLE and vSDLE is accepted on both products - a POST
      on Gen NX, a PUT on the stage-created record on Civil NX - so vSDLE is
      not required while bSDLE is at its default. What bSDLE=true needs on the
      JP edition is unmeasured.
    evidence: >-
      docs/live_verification_notes.md, 2026-08-17 batch 11a and its
      2026-09-01 re-test: scripts/live_crud_check.py's
      ConstructionStageAnalysisControlData case, whose payload omits both.

sdkRules:
  - id: db-stct-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
