manualDefects:
  - describes: enum
    manualSays: >-
      The main Specifications table types `INIT_LOAD_TYPE` as `Integer(enum)`
      and prints its two options as "0=비선형 정적 해석, 0=정적/시공단계 결과
      가져오기" - the literal `0` for both.
    actual: >-
      The two options are `0` and `1`. The live /info schema describes the same
      field as "Initial Load Type (Perform NL Static:0, Import Static:1)", whose
      two options correspond to the manual's two in the same order. The
      duplicate is self-refuting rather than merely unverified: an enum cannot
      name one literal twice, so the row as printed cannot be followed at all.
    evidence: >-
      GET /info/db/THGC-M1 on Civil NX, captured 2026-09-03 during the
      full /info sweep of every /db/* resource on both products. Registered as
      MD-18.
  - describes: field_name
    manualSays: >-
      The "ITER_PARAM 서브 파라미터" table's Key column does not give property
      names for two of its groups. `NORM_CTRL`'s children are stated as a path
      on one row - "`DISP` → `{OPT_USE, VALUE}`", repeated for `FORCE` and
      `ENERGY` - and `LINE_SEARCH`'s five children follow as sibling rows
      distinguished only by a "-" in the 설명 column.
    actual: >-
      Read as printed, that table yields a field literally named
      `{OPT_USE, VALUE}` and puts ten children beside the two parents that own
      them. The section's own Request Example nests all of them:
      `"NORM_CTRL": {"DISP": {"OPT_USE": true, "VALUE": 0.001}, ...}` and
      `"LINE_SEARCH": {"OPT_USE": true, "LINE_SEARCH_OPT": 1, ...}`. Same class
      as MD-07, MD-08 and MD-13 - a Key cell carrying a path or a set instead
      of one wire property. `ITER_PARAM`'s subtree in this contract is the
      hand-resolved shape; the section's other two sub-tables need no such
      correction and are merged mechanically by
      `scripts/extract_contracts.py`'s structural-split registry.
    evidence: >-
      docs/manual/09_DB_Dynamic_Loads.md section 4-2 (the table, line 1062)
      against 4-3 (the Request Body example). Registered as MD-20.
  - describes: requiredness
    manualSays: >-
      The "ITER_PARAM 서브 파라미터" table marks all five children of
      `LINE_SEARCH` Required - `OPT_USE`, `LINE_SEARCH_OPT`, `START_ITER_NO`,
      `MAX_LINE_SEARCH_ITER` and `LINE_SEARCH_TOL`.
    actual: >-
      Unresolved, and recorded here rather than decided. The same section's
      Python example sends `"LINE_SEARCH": {"OPT_USE": False}` and omits the
      other four, so the chapter contradicts itself in the way MD-16 describes:
      requiredness stated with no reference to the switch that governs it.
      Nobody has put either form to a running product, so this contract keeps
      the table's claim in `requirement` and leaves every `safeToOmit`
      unverified. Measuring it needs a PUT, which mutates global solver
      settings, so it is not something a read-only sweep can settle.
    evidence: >-
      docs/manual/09_DB_Dynamic_Loads.md section 4-2 (the table) against 4-4
      (the Python example), same chapter, same section. Registered as MD-19.

extraction:
  source: 09_DB_Dynamic_Loads.md line 1047
  table: 메인 파라미터
  note: >-
    All three supplementary tables are structural, not conditional: each heading
    names the object field it belongs to, and the section's Request Example
    carries all three nested under their parents in one payload, with no
    discriminator selecting between them. None is listed under `unmergedTables`
    because none is unresolved - the field list below is complete.
  structuralTables:
    - heading: INCREMENT_STEP 서브 파라미터
      line: 1063
      paths: [INCREMENT_STEP]
    - heading: ITER_PARAM 서브 파라미터
      line: 1071
      paths: [ITER_PARAM]
      note: >-
        The only one of the three the extractor cannot merge mechanically, and
        the reason is in the table rather than the heading: its Key column
        states `NORM_CTRL`'s children as a path (`DISP` → `{OPT_USE, VALUE}`)
        and lists `LINE_SEARCH`'s five children as sibling rows. Merged as
        parsed it would invent a field named `{OPT_USE, VALUE}` and flatten two
        levels, so the subtree here is hand-resolved against the section's
        Request Example and the Key column is registered as MD-20. The other
        two tables are in `scripts/extract_contracts.py`'s structural-split
        registry and merge without judgment.
    - heading: HINGE_OPT 서브 파라미터
      line: 1093
      paths: [HINGE_OPT]
