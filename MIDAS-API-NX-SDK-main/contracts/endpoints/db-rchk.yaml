manualDefects:
  - describes: field_value
    manualSays: >-
      Five count fields are typed one way by a 파라미터 table and the other way
      by the section's own JSON Schema, printed directly above it.
      `dSUB_BARNUM`, `SUBBAR_NUM`, `SUBBAR_NUM_Y` and `SUBBAR_NUM_Z` are
      Integer in the tables and `number` in the schema; `BAR_NUM` under
      `vPOSITION` is Number in the table and `integer` in the schema.
    actual: >-
      The schema is internally consistent and the tables are not. `BAR_NUM`
      is the same field name with the same description (철근 개수) in two
      tables, typed Integer in one and Number in the other, while the schema
      types both occurrences `integer` - so the Number cell is the outlier and
      is recorded as `integer`. The other four have no third statement: the
      section's Request Example sends whole numbers, which satisfy both
      readings. Those keep the tables' Integer as the narrower of the two
      documented types, so following this contract cannot produce a value the
      schema's reading would refuse. No live call has measured any of the
      five, and neither published surface distinguishes them - TypeScript has
      a single number type, and none of these five is a Python TypedDict
      member.
    evidence: >-
      docs/manual/24_DB_Design.md section 3's four 파라미터 tables against the
      JSON Schema printed above them in the same section, and against the
      section's own POST/PUT Request Body. Registered as MD-27.

  - describes: field_name
    manualSays: >-
      The `BEAM` object holds `vMAIN` and `vSUB_BAR` and nothing else.
    actual: >-
      `GET /info/db/RCHK` declares a third member, `OPTION_IMJSAME`, a
      boolean described " IMJ Same Option (it needs only I)". No rule is
      written from that description: it reads like a statement about which
      sector entry the server consults, and a description is not a branch.
    evidence: >-
      Found by scripts/info_baseline.py --against-contracts on 2026-09-04,
      sweeping the 2026-09-03 /info capture against every contract. The
      manual was then searched in full for the name, not just this
      section. Civil NX only, as the endpoint is. Registered as MD-41.

sdkRules:
  - id: db-rchk-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-rchk-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

