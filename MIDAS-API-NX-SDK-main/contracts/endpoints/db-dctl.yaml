# /db/DCTL
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-dctl
endpoint: /db/DCTL
name: Definition of Frame
surface:
  className: FrameDefinition
  exportName: frameDefinition
  modulePath: [db, design]
  payloadTypeName: FrameDefinitionPayload

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 24_DB_Design.md
    section: "6. `/db/DCTL` — Definition of Frame (프레임 정의)"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_civil
  records:
    - product: civil
      ref: db-write-sweep-2026-08-24

operations:
  - method: DELETE
    variant: per_id
    path: /db/DCTL/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: FRAMEX
    description: >-
      프레임 X방향 · 비횡구속·Sway: "Unbraced Sway" / 횡구속·Non-sway: "Braced Non-sway"
    type: string
    requirement: optional
    documentedDefault: Braced Non-sway
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: FRAMEY
    description: >-
      프레임 Y방향 · "Unbraced Sway" / "Braced Non-sway"
    type: string
    requirement: optional
    documentedDefault: Braced Non-sway
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: bAUTOKF
    description: >-
      유효좌굴길이계수 자동 계산
    type: boolean
    requirement: optional
    documentedDefault: false
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: DT
    description: >-
      설계 타입 · 3-D: "3D" / X-Z 평면: "XZ" / Y-Z 평면: "YZ" / X-Y 평면: "XY"
    type: string
    requirement: optional
    documentedDefault: 3D
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual

sdkRules:
  - id: db-dctl-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-dctl-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 24_DB_Design.md line 855
  table: 파라미터
