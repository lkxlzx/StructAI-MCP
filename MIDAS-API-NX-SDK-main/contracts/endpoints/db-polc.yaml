    products: [gen]
    type: boolean
    requirement: optional
    documentedDefault: false
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: bDRIFTAVER
    description: >-
      층 평균변위로 계산된 층간변위
    products: [gen]
    type: boolean
    requirement: optional
    documentedDefault: false
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: LOADPATTERNTYPE
    description: >-
      하중 패턴 타입 · 정적하중: "LOAD" / 균등가속도: "ACC" / 모드형상: "MODE" / 정규화모드형상×질량:
      "NOR_MODE"
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: LOADPATTERN
    description: >-
      하중 패턴 목록
    type: array
    items:
      type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual

    properties:
      - key: LCNAME
        description: >-
          하중케이스명
        type: string
        requirement: conditional
        condition: 'LOADPATTERNTYPE="LOAD"'
        appliesWhen:
          - path: LOADPATTERNTYPE
            equals: "LOAD"
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'LOADPATTERN' in a second
        # table headed "LOADPATTERN 배열 항목 - LOADPATTERNTYPE 별 필드", whose
        # first column is the value of LOADPATTERNTYPE. That value is a root
        # field of this same record, so the condition can be structured here,
        # unlike /db/SLAN's design-code table. GET /info/db/POLC repeats each
        # branch in the field's own description - "(if Used Load Pattern=ACC)"
        # and so on. See MD-44.
      - key: DIR
        description: >-
          방향 ("DX"/"DY"/"DZ")
        type: string
        requirement: conditional
        condition: 'LOADPATTERNTYPE="ACC"'
        appliesWhen:
          - path: LOADPATTERNTYPE
            equals: "ACC"
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: MODE
        description: >-
          모드 번호
        type: integer
        requirement: conditional
        condition: 'LOADPATTERNTYPE="MODE" 또는 "NOR_MODE"'
        appliesWhen:
          - path: LOADPATTERNTYPE
            in: ["MODE", "NOR_MODE"]
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: SF
        description: >-
          축척계수
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'LOADPATTERN' by naming it in
        # every one of the second table's three branches, so unlike its
        # siblings it carries no condition. /info gives it no description at
        # all, which is consistent with a field that applies throughout.
manualDefects:
  - describes: field_name
    manualSays: >-
      `LOADPATTERN` is row 22, `Array [Object]`, Required, and a second table
      gives its members per `LOADPATTERNTYPE`: `LCNAME`/`SF` for `"LOAD"`,
      `DIR`/`SF` for `"ACC"`, `MODE`/`SF` for `"MODE"` and `"NOR_MODE"`.
    actual: >-
      Those four are the members, and `GET /info/db/POLC` declares exactly
      them, repeating each branch in the property's own description. This
      contract published the array with no members until 2026-09-04. As with
      /db/SLAN, the manual is not wrong - the branch table is a reasonable way
      to state it, and the extractor could not attach it.
    evidence: >-
      GET /info/db/POLC on Civil NX, captured 2026-09-03, against
      docs/manual/14_DB_Pushover.md lines 1556-1572. Registered as MD-44.

sdkRules:
  - id: db-polc-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-polc-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 14_DB_Pushover.md line 1533
  table: Parameters
