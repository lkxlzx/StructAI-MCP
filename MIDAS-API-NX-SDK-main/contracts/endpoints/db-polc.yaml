# /db/POLC
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products, verification status and the DELETE
# shape come from docs/coverage.json's live record and the measured /db/* DELETE
# behaviour, not from the manual's framing. safeToOmit is answered `true` only
# where a confirmed live payload actually omitted the field.
contractVersion: 1
id: db-polc
endpoint: /db/POLC
name: Pushover Load Cases
surface:
  className: PushoverLoadCase
  exportName: pushoverLoadCase
  modulePath: [db, pushover]
  payloadTypeName: PushoverLoadCasePayload
  nestedTypes:
    - {path: LOADPATTERN, name: PushoverLoadPatternItem, namespace: DbPushoverTypes}

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 14_DB_Pushover.md
    section: "5. `/db/POLC` — Pushover Load Cases"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-read-sweep-2026-07-26
    - product: gen
      ref: db-read-sweep-2026-07-26

operations:
  - method: DELETE
    variant: per_id
    path: /db/POLC/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

