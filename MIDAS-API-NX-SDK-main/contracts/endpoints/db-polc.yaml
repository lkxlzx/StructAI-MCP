  - key: LIMITDEFORMANGLE
    description: >-
      층간변형각 제한값 (1/[rad])
    products: [gen]
    # NOTE: /info evidence, not the manual's. GET /info/db/POLC declares this
    # on gen and not on the other product, captured 2026-09-03. The section
