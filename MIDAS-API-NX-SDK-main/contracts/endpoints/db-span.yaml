# /db/SPAN
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-span
endpoint: /db/SPAN
name: Span Information
surface:
  className: Span
  exportName: span
  modulePath: [db, project]
  payloadTypeName: SpanPayload
  nestedTypes:
    - {path: SPAN_BASE_ITEMS, name: SpanBaseItem, namespace: DbProjectTypes}

products: [civil]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 02_DB_Project_Structure.md
    section: "14. `/db/SPAN` — Span Information"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_civil
  records:
    - product: civil
      ref: db-write-sweep-2026-08-16

operations:
  - method: DELETE
    variant: per_id
    path: /db/SPAN/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: NAME
    description: >-
      Span Name
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: bEXACTSPAN
    description: >-
      Exact Span Option
    type: boolean
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: DIRECTION
    description: >-
      Inner Direction of Multiple Girders · 0=(-) Local y / 1=(+) Local y /
      2=Both / 3=None
    type: integer
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: SECTTYPE
    description: >-
      Assign Elements · 0=By Selection / 1=Number
    type: integer
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: SPAN_LIST
    description: >-
      Span List (bEXACTSPAN=true 시)
    type: array
    items:
      type: number
    requirement: conditional
    condition: bEXACTSPAN=true
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: SPAN_BASE_ITEMS
    type: array
    items:
      type: object
    requirement: optional
    documentedDefault: null
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: ELEM_KEY
        description: >-
          Span Base Items (bEXACTSPAN=true 시) · Element Key
        type: integer
        requirement: conditional
        condition: bEXACTSPAN=true
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: SUPPORT
        description: >-
          Span Base Items · Support type · 0=None / 1=Start / 2=End
        type: integer
        requirement: conditional
        condition: bEXACTSPAN=true
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual

sdkRules:
  - id: db-span-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-span-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 02_DB_Project_Structure.md line 1211
  table: Specifications
