contractVersion: 1
id: db-iehg-beam-m1
endpoint: /db/IEHG-BEAM-M1
name: Assign Inelastic Hinges – Beam (Hyper-S)
surface:
  className: InelasticHingePropertyHyperSBeam
  exportName: inelasticHingePropertyHyperSBeam
  modulePath: [db, properties, hinge]
  payloadTypeName: InelasticHingePropertyHyperSPayload

products: [civil]

source:
  manual:
    status: absent
    justification: >-
      The chapter section for this endpoint states only a URL, its methods and
      a link to the official article - it carries no Specifications table and no
      JSON Schema, so the manual describes the endpoint's existence but not its
      request. The fields below come from GET /info{endpoint}, captured in
      schema/hyper-s-info.json; the methods and the label above are still the
      manual's. Registered as MD-12.
    repo: Dennis5882/MIDAS-API
    chapterFile: 04_DB_Properties.md
    section: "24. `/db/IEHG-BEAM-M1`"
    url: https://support.midasuser.com/hc/ko/articles/57668691043865
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_civil
  records:
    - product: civil
      ref: db-read-sweep-2026-07-30

operations:
  - method: DELETE
    variant: per_id
    path: /db/IEHG-BEAM-M1/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: INEL_PROP_NAME
    description: >-
      Inelastic Hinge Property Name
    type: string
    requirement: unstated
    documentedDefault: null
    documentedOptional: null
    safeToOmit: unverified
    provenance: info_schema

sdkRules:
  - id: db-iehg-beam-m1-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-iehg-beam-m1-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

