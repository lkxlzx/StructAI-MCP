        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
    # The User Type table's; the design-code examples were sent with this
    # curve as well and are stored with it (2026-09-22).

manualDefects:
  - describes: behaviour
    manualSays: >-
      The EURO2004 table places SPECTYPE, GROUTYPE and NATIONALANNEX in OPT,
      and its Request Body sends them there with VAL.ag.
    actual: >-
      That body is refused with Unknown Error on both products, and so is it
      with OPT removed, with VAL.AG (the /info spelling), and with both.
      GET /info declares the three in STR, as strings. No working EURO2004
      request has been found.
    evidence: >-
      scripts/live_manual_feedback.py --case c3 and --case c4, 2026-09-22;
      docs/live_verification_notes.md; MD-60.
  - describes: requiredness
    manualSays: >-
      The KDS(41-17-00:2019) parameter table marks `CALC_OPT` `Create Only`,
      which says the server reads it on POST and ignores it on PUT.
    actual: >-
      It is honoured on PUT. Sending `CALC_OPT: true` on a PUT rebuilt a
      spectrum that had been hand-set to a flat two-point curve into the
      103-point curve the code parameters generate; sending `false`, or
      omitting it, left the stale curve in place while accepting new
      parameters. The cell is true of the manual's other `Create Only`,
      /db/SECT's, and not of this one - which is why the contract schema's
      `create_only` describes the documentation and not the behaviour.
    evidence: >-
      docs/live_verification_notes.md, "what the manual's 'Create Only'
      actually means" (2026-09-03), measured on Gen NX against an empty
      document. Registered as MD-15.
  - describes: behaviour
    manualSays: >-
      The section's KDS(41-17-00:2019) Request Body example omits `CALC_OPT`
      and supplies no `aFUNC`, presenting it as a working request.
    actual: >-
      That exact body is refused: `[Error] Spectrum Function Data (Name:...)
      contains errors.(Item:Spectrum Data)`. A design-spectrum function needs
      either `CALC_OPT: true`, so the server builds the curve from
      `STR`/`OPT`/`VAL`, or an explicit `aFUNC`. The documented default
      `false` is correct; it is the example that cannot run.
    evidence: >-
      docs/live_verification_notes.md, "what the manual's 'Create Only'
      actually means" (2026-09-03). Registered as MD-15.

sdkRules:
  - id: db-spfc-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-spfc-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

