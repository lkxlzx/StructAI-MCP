    # KDS(17-10-00:2018) and KS_BRG number their rows VAL.(n). The Taiwan(2022)
    # zone rows state their zone in words, not as an iSEISZONE value, so the
    # zone is kept as condition text. Stored as sent on both products for every
    # design-code Request Body in the section except EURO2004 (2026-09-22).
  - key: CALC_OPT
    description: >-
      계산 옵션
    type: boolean
    requirement: optional
    documentedDefault: false
    documentedOptional: false
    safeToOmit: unverified
    provenance: live_corrected
    # Marked Create Only; honoured on PUT as well (MD-15, recorded under
    # manualDefects).
  - key: aFUNC
    description: >-
      함수 데이터 배열
    type: array
    items:
      type: object
    requirement: conditional
    condition: "User Type; a design-code function needs it unless CALC_OPT is true (MD-15)"
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    properties:
