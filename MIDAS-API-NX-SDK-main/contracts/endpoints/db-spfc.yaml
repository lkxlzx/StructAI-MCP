# /db/SPFC
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-spfc
endpoint: /db/SPFC
name: Response Spectrum Functions
surface:
  className: ResponseSpectrumFunction
  exportName: responseSpectrumFunction
  modulePath: [db, dynamicLoads]
  payloadTypeName: ResponseSpectrumFunctionPayload
  nestedTypes:
    - {path: aFUNC, name: ResponseSpectrumFunctionValue, namespace: DbDynamicLoadsTypes}

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 09_DB_Dynamic_Loads.md
    section: 1. /db/SPFC – Response Spectrum Functions
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-write-sweep-2026-08-16
    - product: gen
      ref: db-write-sweep-2026-08-16
    - product: gen
      ref: spfc-calc-opt-2026-09-03

operations:
  - method: DELETE
    variant: per_id
    path: /db/SPFC/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: NAME
    description: >-
      RS 함수명
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: iTYPE
    description: >-
      스펙트럼 데이터 타입 (1=정규화가속도, 2=가속도, 3=속도, 4=변위)
    type: integer
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: iMETHOD
    description: >-
      스케일 방법 (0=Scale Factor, 1=Max Value)
    type: integer
    requirement: optional
    documentedDefault: 0
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: SCALE
    description: >-
      스케일 값
    type: number
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: GRAV
    description: >-
      중력 가속도 (정규화 가속도 타입에만 해당)
    type: number
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: DRATIO
    description: >-
      감쇠비
    type: number
    requirement: optional
    documentedDefault: 0.05
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: DESC
    description: >-
      설명
    type: string
    requirement: optional
    documentedDefault: ""
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: STR
    description: >-
      코드 데이터 (STR 오브젝트)
    type: object
    requirement: conditional
    condition: "Korea/US/Eurocode/China/Japan/Taiwan/India/Other Countries Type"
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: SPEC_CODE
        description: >-
          설계 스펙트럼 코드
        type: string
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: SFI
        description: >-
          설계 지진 등급(Seismic Fortification Intensity)
        type: string
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "CH2010"
        documentedDefault: "0.05g"
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: SC_
        description: >-
          지반 종류(I0/I1/II/III/IV)
        type: string
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "CH2010"
        documentedDefault: "I0"
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: EQ_
        description: >-
          지진 영향(Frequent/Middle/Scarce)
        type: string
        requirement: required
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "CH2010"
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: SPECTYPE
        description: >-
          스펙트럼 타입 (1=Elastic, 2=Design)
        type: string
        requirement: unstated
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "EURO2004"
        documentedDefault: null
        documentedOptional: null
        safeToOmit: unverified
        provenance: info_schema
      - key: GROUTYPE
        description: >-
          지반 타입 (0=A, 1=B, 2=C, 3=D, 4=E)
        type: string
        requirement: unstated
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "EURO2004"
        documentedDefault: null
        documentedOptional: null
        safeToOmit: unverified
        provenance: info_schema
      - key: NATIONALANNEX
        description: >-
          국가 부속서 코드
        type: string
        requirement: unstated
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "EURO2004"
        documentedDefault: null
        documentedOptional: null
        safeToOmit: unverified
        provenance: info_schema
    # Every design-code table places its rows by object: KDS(41-17-00:2019)'s
    # rows are numbered under STR/OPT/VAL, and the later tables write the object
    # beside each key - `SFI`(STR), `PERIOD`(VAL). Each member applies to the
    # SPEC_CODE values whose tables list it; the SPEC_CODE tables name them.
    # The EURO2004 table puts SPECTYPE, GROUTYPE and NATIONALANNEX in OPT;
    # GET /info declares them in STR as strings, and the section's EURO2004
    # Request Body is refused as printed on both products, with or without OPT
    # (2026-09-22). They are recorded where /info puts them, claiming nothing.
  - key: OPT
    description: >-
      옵션 데이터 (OPT 오브젝트)
    type: object
    requirement: optional
    documentedDefault: null
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: SC_
        description: >-
          지반 분류 (0=S1, 1=S2, 2=S3, 3=S4, 4=S5, 5=S6)
        type: integer
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            in: ["KDS(17-10-00:2018)", "KDS(41-17-00:2019)"]
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: iSEISZONE
        description: >-
          지진 구역
        type: integer
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            in: ["IRC:SP:114-2018", "IS1893(2016)", "IS2002", "JP_BRG2002", "JP_BRG2012", "JP_BRG2017", "KDS(17-10-00:2018)", "KDS(41-17-00:2019)", "TAIWAN(2022)"]
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: NSC
        description: >-
          근원 유형(0/1/2)
        type: integer
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "CH2010"
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: nLForce
        description: >-
          공칭 횡력(0=전단력차, 1=관성력)
        type: integer
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "CH2010"
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: iSEISZONEFACTOR
        description: >-
          지진 지역 계수(Z) 0=1.0/1=0.9/2=0.8/3=0.7
        type: integer
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "JPN2000"
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: SOILCLASS
        description: >-
          지반 종류
        type: integer
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            in: ["IRC:SP:114-2018", "IS1893(2016)", "IS2002", "JPN2000", "JP_BRG2002", "JP_BRG2012", "JP_BRG2017", "TAIWAN(2022)"]
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: iEQMETHOD
        description: >-
          지진 입력 방법(Level1/Level2 Type I/Level2 Type II)
        type: integer
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            in: ["JP_BRG2002", "JP_BRG2012", "JP_BRG2017"]
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: iSPECTYPE
        description: >-
          스펙트럼 방향(0=수평/1=수직)
        type: integer
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "TAIWAN(2022)"
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: iSPECUSE
        description: >-
          스펙트럼 용도(0=Design/1=Small-Medium/2=Maximum)
        type: integer
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "TAIWAN(2022)"
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: iSUBZONE
        description: >-
          세부 구역(Taipei Basin I~IV/User Input, 구역이 Taipei Basin일 때)
        type: integer
        requirement: optional
        appliesWhen:
          - path: STR.SPEC_CODE
            equals: "TAIWAN(2022)"
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: ZA
