# /db/SLAN
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-slan
endpoint: /db/SLAN
name: Traffic Surface Lanes
surface:
  className: TrafficSurfaceLanes
  exportName: trafficSurfaceLanes
  modulePath: [db, movingLoads]
  payloadTypeName: TrafficSurfaceLanePayload
  nestedTypes:
    - {path: LANE_ITEMS, name: SurfaceLaneItem, namespace: DbMovingLoadsTypes}

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 08_DB_Moving_Loads.md
    section: 7. /db/SLAN – Traffic Surface Lanes
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-read-sweep-2026-07-26
    - product: gen
      ref: db-read-sweep-2026-07-26

operations:
  - method: DELETE
    variant: per_id
    path: /db/SLAN/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: NAME
    description: >-
      Name of Surface Lane
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: WIDTH
    description: >-
      Lane Width
    type: number
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: WHEEL_SPACE
    description: >-
      Wheel Spacing
    type: number
    requirement: optional
    documentedDefault: 0
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: SKEW_START
    description: >-
      Skew Start
    type: number
    requirement: optional
    documentedDefault: 0
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: SKEW_END
    description: >-
      Skew End
    type: number
    requirement: optional
    documentedDefault: 0
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: bOPTIMIZE
    description: >-
      Transverse Lane Optimization
    type: boolean
    requirement: optional
    documentedDefault: false
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: ALLOW_WIDTH
    description: >-
      Allow Width for Optimization
    type: number
    requirement: optional
    documentedDefault: 0
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: MV_DIR
    description: >-
      Moving Direction ("FORWARD" / "BACKWARD" / "BOTH")
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: SEQ
    description: >-
      Sequence Number (Unique)
    type: integer
    requirement: optional
    documentedDefault: 1
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: LANE_ITEMS
    description: >-
      Lane Items
    type: array
    items:
      type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual

    properties:
      - key: NODE
        description: >-
          Node Key
        type: integer
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: OFFSET
        description: >-
          Offset Distance to Lane Center
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: IMPACT_FACTOR
        description: >-
          Impact Factor
        type: number
        requirement: conditional
        condition: "Korea, AASHTO Standard, Taiwan"
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'LANE_ITEMS' in a second
        # table headed "Parameters - LANE_ITEMS (코드별 추가 필드)", whose rows
        # are design codes rather than field numbers. No `appliesWhen` is
        # written from it: the code is a model-wide setting, not a property of
        # this payload, so the manual names no wire discriminator and this
        # contract will not invent one. The condition keeps the manual's own
        # code list. GET /info/db/SLAN repeats each restriction in the
        # field's own description. See MD-44.
      - key: bSPAN_START
        description: >-
          Is Span Start
        type: boolean
        requirement: conditional
        condition: "Korea, AASHTO Standard, Taiwan, AASHTO LRFD, PENNDOT, Australia, Poland"
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: CENTRI_FORCE
        description: >-
          Centrifugal Force (Only Use AASHTO LRFD)
        type: number
        requirement: conditional
        condition: "AASHTO LRFD"
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: IMPACT_SPAN_TYPE
        description: >-
          Impact Span Type (Only Use India Code)
        type: string
        requirement: conditional
        condition: "India"
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: IMPACT_FACTOR_INDIA
        description: >-
          IF/CDA (Only Use India Code)
        type: number
        requirement: conditional
        condition: "India"
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: SPAN_LENGTH
        description: >-
          Span Length (Only Use India Code)
        type: number
        requirement: conditional
        condition: "India"
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: ECCEN_VERT_LOAD
        description: >-
          Eccentricity of Vertical Loads (Only Use EuroCode)
        type: number
        requirement: conditional
        condition: "Eurocode"
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
manualDefects:
  - describes: field_name
    manualSays: >-
      `LANE_ITEMS` is row 10, `Array[Object]`, Required, and its members are
      given in a second table whose rows are design codes - six rows naming
      between two and five keys each.
    actual: >-
      The members are the nine those rows name between them, and `GET
      /info/db/SLAN` declares exactly those nine. This contract published
      `LANE_ITEMS` with no members at all until 2026-09-04, so the npm payload
      type had an array whose item shape nothing described. The manual is not
      wrong here - the second table is a legitimate way to state a per-code
      field set, and the extractor read it as a variant table it could not
      attach.
    evidence: >-
      GET /info/db/SLAN on Civil NX, captured 2026-09-03, against
      docs/manual/08_DB_Moving_Loads.md section 7's two Parameters tables.
      Registered as MD-44.

sdkRules:
  - id: db-slan-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-slan-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 08_DB_Moving_Loads.md line 578
  table: Parameters
