manualDefects:
  - describes: field_name
    manualSays: >-
      04_DB_Properties.md, section 2: the Hyper-S endpoint uses the same base
      material structure as /db/MATL and additionally supports Hyper-S
      hyperelastic material models.
    actual: >-
      The two endpoints do not share their wire keys. /db/MATL-M1 takes
      MATL_NAME, MATL_TYPE, PARAM and DAMP_RAT; /db/MATL takes NAME, TYPE,
      PARAM, DAMP_RAT, HE_COND, HE_SPEC, PLMT, P_NAME and bMASS_DENS. The
      hyperelastic fields HE_COND and HE_SPEC are on /db/MATL, not on the
      Hyper-S endpoint the sentence is describing. PARAM[].P_TYPE is also
      numbered differently: 0-based here, 1-based on /db/MATL.
    evidence: >-
      docs/live_verification_notes.md, "/db/MATL-M1 is not /db/MATL plus
      Hyper-S additions" (Civil NX 2026 v2.2, 2026-08-31), confirmed by the
      write round trips of all three P_TYPE branches the same day and by the
      /info capture in schema/hyper-s-info.json. Registered as MD-03.

sdkRules:
  - id: db-matl-m1-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-matl-m1-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
