# /db/MATL-M1
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-matl-m1
endpoint: /db/MATL-M1
name: Material Properties (Hyper-S)
surface:
  className: MaterialHyperS
  exportName: materialHyperS
  modulePath: [db, properties, material]
  payloadTypeName: MaterialHyperSPayload
  nestedTypes:
    - {path: PARAM, name: MaterialHyperSParam, namespace: DbPropertiesMaterialTypes}
    - {path: PARAM.THERMAL_TRANS, name: MaterialHyperSThermalTransfer, namespace: DbPropertiesMaterialTypes}
    - {path: PARAM.USER_DEFINED, name: MaterialHyperSUserDefined, namespace: DbPropertiesMaterialTypes}

products: [civil]

source:
  manual:
    status: contradicted
    justification: >-
      The chapter section for this endpoint states only a URL, its methods and
      a link to the official article - it carries no Specifications table and no
      JSON Schema, so the manual describes the endpoint's existence but not its
      request. The fields below come from GET /info{endpoint}, captured in
      schema/hyper-s-info.json; the methods and the label above are still the
      manual's. Registered as MD-12.

      This section additionally claims the endpoint's base material structure is
      the same as /db/MATL with Hyperelastic support added. It is not, which is
      why the status here is contradicted rather than absent - see manualDefects
      and MD-03.
    repo: Dennis5882/MIDAS-API
    chapterFile: 04_DB_Properties.md
    section: "2. `/db/MATL-M1`"
    url: https://support.midasuser.com/hc/ko/articles/56396523438873
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_civil
  records:
    - product: civil
      ref: db-write-sweep-2026-08-31

operations:
  - method: DELETE
    variant: per_id
    path: /db/MATL-M1/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

