manualDefects:
  - describes: field_name
    manualSays: >-
      Five Key cells in this section name more than one wire property, and one
      table states its rows' destinations outside the Key column entirely.
      Row 5 of the top-level table is keyed `"bSDLE"` / `"vSDLE"`; the
      TIME_DEP_CONTROL table has `"bTTLE_ES"` / `"iTTLE_ES"`; the NONL_CONTROL
      table keys three sibling objects `"DISP"/"LOAD"/"WORK"` and states
      `ADVANCED`'s entire subtree as prose inside one Description cell; and the
      "나머지 객체" table gives each row's parent in an `Object` column, keying
      one row `"bTRUSS"` / `"bBEAM"` and another
      `"OPT_USE"` / `"iSDOPT"` / `"SDCONST"`.
    actual: >-
      Every one of them is a set of sibling properties, and the section's own
      Request Body example sends them that way. `GET /info/db/STCT-M1`
      independently confirms the top-level split: `bSDLE` is a boolean
      "Secondary Dead Load Effect" and `vSDLE` an array "SDL Load Case Names",
      two of the sixteen root properties it declares. Same family as MD-07,
      MD-08, MD-13 and MD-20. Four of the six supplementary tables need no
      correction and are merged mechanically by
      `scripts/extract_contracts.py`'s structural-split registry; the two that
      do are resolved by hand in this contract.
    evidence: >-
      docs/manual/12_DB_Analysis_Control.md section 18's Parameters tables
      against its Request Body (PUT) example, plus GET /info/db/STCT-M1 on
      Civil NX captured 2026-09-03. Registered as MD-21.
  - describes: field_name
    manualSays: >-
      The top-level Parameters table lists fourteen rows and presents itself as
      the record's root, and no row names a final-stage name.
    actual: >-
      `GET /info/db/STCT-M1` declares sixteen root properties, and the one the
      table has no counterpart for is `FINAL_STAGE`, a string "Final Stage
      Name". It is what `bLAST_FINAL: false` - the table's own "Other Stage"
      option - has to be answered with. Recorded `requirement: unstated`: /info
      declares no `required` array and the manual makes no claim at all, so
      "Optional" would be a claim nobody has made. Same shape as MD-10.
    evidence: >-
      GET /info/db/STCT-M1 on Civil NX, captured 2026-09-03 during the full
      /info sweep. Registered as MD-22.

