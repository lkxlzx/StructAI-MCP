extraction:
  source: 27_Design_SRC_AIKSRC2K.md line 6872
  table: 파라미터

manualDefects:
  - describes: requiredness
    manualSays: >-
      The parameter table leaves the 필수 column blank for `BAR_SECTOR_I`,
      `BAR_SECTOR_M` and `BAR_SECTOR_J`, which reads as all three being
      optional.
    actual: >-
      The section's own JSON Schema puts them under an `anyOf` requiring at
      least one of the three, alongside a flat `required` list holding `DT`,
      `DB` and `SHEAR_BAR`. A record with no bar sector at all is not a valid
      request, and the table cannot say so - a per-row Optional/Required column
      has no way to express "at least one of these three". Recorded rather than
      transcribed as a condition, because none of the three is individually
      conditional on anything.
    evidence: >-
      The section's own JSON Schema block, 27_Design_SRC_AIKSRC2K.md, read
      against its parameter table.

sdkRules:
  - id: design-src-aik-src2k-mrbd-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: design-src-aik-src2k-mrbd-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog. SRC beam rebar is design input a caller cannot
      reconstruct from the model geometry.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

