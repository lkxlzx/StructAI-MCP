# /DESIGN/SRC/AIK-SRC2K/MRBD
#
# Held out of the source of truth until 2026-09-03 for carrying 14 of the 54
# paths the section's own JSON Schema declares. The manual was not the problem:
# its parameter table documents all 54, nesting them with `└` depth markers
# instead of a No. column. The extractor's duplicate suppression keys on the
# No. column's parent, so a table with no numbers collapsed to the bare key and
# dropped every repeat - and a rebar table is nothing but repeats, with NAME and
# NUM recurring under LAYER1 and LAYER2, under TOP and BOT, and under three bar
# sectors. Fixed in the extractor; this contract is the whole table.
