manualDefects:
  - describes: requiredness
    manualSays: >-
      The 12-B table marks `CALC_OPT` `Create Only`, one of only two cells in
      the whole manual that use that value.
    actual: >-
      True here, and measured: the body a POST refuses - `CALC_OPT: false` with
      no `SECT_I.STIFF` to fall back on, answered `[Error] Section input data
      contain errors.` - is accepted as a PUT, and a PUT never recomputes
      `STIFF` even with `CALC_OPT: true` sent explicitly. The defect is that
      the manual's *other* `Create Only`, `/db/SPFC`'s, does not behave this way
      at all, so the value carries two contracts with nothing to tell them
      apart. Registered as MD-15; the contract schema's `create_only` therefore
      records what the manual claims, not what a product does.
    evidence: >-
      docs/live_verification_notes.md, "what the manual's 'Create Only' actually
      means" (2026-09-03), measured on Gen NX against an empty document.
  - describes: field_name
    manualSays: >-
      The four SECTTYPE tables number their rows `(1)`, `(2)`, `i`..`iv` and
      `DB`/`User`, none of which names a path, and 12-B's `(1) vSIZE` follows a
      row typed Boolean.
    actual: >-
      Those numbers continue the common table's `SECT_BEFORE` numbering rather
      than addressing the row above, so read literally they nest a section's
      dimensions inside a boolean flag. Every one of the four tables' own
      Request Examples places these fields under `SECT_BEFORE`, and 12-A's
      `DB`/`User` column is a condition on `DATATYPE`, not a level. The
      structure in this contract is read from those examples.
    evidence: >-
      The section's own Request Examples, 04_DB_Properties.md lines 1118, 1150,
      1188 and 1230.

sdkRules:
  - id: db-sect-put-does-not-recompute
    kind: warn
    appliesTo: [PUT]
    reason: >-
      For SECTTYPE VALUE the server derives SECT_BEFORE.SECT_I.STIFF and
      .DESIGN from vSIZE on POST only. A PUT that changes vSIZE stores the new
      dimensions and leaves the old properties, answers 200 with no error, and
      reads back looking self-consistent - a 0.3m section resized to 0.9m kept
      AREA 0.004533 where a fresh POST at 0.9m gives 0.008433. Sending
      CALC_OPT: true on the PUT does not help.
    alternative: >-
      Delete the record and POST it again to get the properties recomputed.
      Neither SDK can do this for the caller: deleting and recreating a section
      changes what elements reference, which is the caller's decision.
  - id: db-sect-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-sect-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog. Deleting a section also orphans every element that
      references it.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 04_DB_Properties.md line 1072
  table: 공통 Specifications (모든 SECTTYPE 공통)
  # The chapter documents four of the eight SECTTYPE values its own common
  # table names. 12-E (TAPERED) is prose describing a second SECT_AFTER object
  # with no parameter table, and COMBINED, COMPOSITE and SOD have no section at
  # all. A record under one of those carries fields this contract does not
  # describe; that is a gap in the manual, not a claim they do not exist.
