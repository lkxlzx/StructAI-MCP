# /db/SECT
#
# Drafted by scripts/extract_contracts.py from the official manual, then written
# by hand: the four documented SECTTYPE tables state their own gate but not
# their own nesting, because their No. columns continue the common table's
# SECT_BEFORE numbering. Each table's Request Example is what places the fields,
# and every one of them puts these under SECT_BEFORE. CALC_OPT is the exception
# and sits at the top level - confirmed by its example and by a live run on
# 2026-09-03.
contractVersion: 1
id: db-sect
endpoint: /db/SECT
name: Section Properties
surface:
  className: Section
  exportName: section
  modulePath: [db, properties, section]
  payloadTypeName: SectionPayload

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 04_DB_Properties.md
    section: "12. `/db/SECT`"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-write-sweep-2026-07-26
    - product: gen
      ref: db-write-sweep-2026-07-26
    - product: gen
      ref: spfc-calc-opt-2026-09-03

operations:
  - method: DELETE
    variant: per_id
    path: /db/SECT/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      For SECTTYPE VALUE the server computes SECT_BEFORE.SECT_I.STIFF and
      .DESIGN from vSIZE on this method only, and writes them into the stored
      record. A supplied STIFF is written through instead, under every
      CALC_OPT value.
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      CALC_OPT has no effect here. A PUT that changes vSIZE stores the new
      dimensions and keeps the old STIFF, so a resized VALUE section carries
      section properties that no longer match it - see sdkRule
      db-sect-put-does-not-recompute.

