# /db/MVLD
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-mvld
endpoint: /db/MVLD
name: Moving Load Cases
surface:
  className: MovingLoadCase
  exportName: movingLoadCase
  modulePath: [db, movingLoads]
  payloadTypeName: MovingLoadCasePayload
  nestedTypes:
    - {path: DEFAULT, name: MovingLoadCaseDefault, namespace: DbMovingLoadsTypes}
    - {path: DEFAULT.SUB_LOAD_DATAS, name: MovingLoadCaseSubLoadDataItem, namespace: DbMovingLoadsTypes}
    - {path: PERMIT_LOAD, name: MovingLoadCasePermitLoad, namespace: DbMovingLoadsTypes}
    - {path: AUTO_OPTIMIZE, name: MovingLoadCaseAutoOptimize, namespace: DbMovingLoadsTypes}
    - {path: AUTO_OPTIMIZE.OPTIMIZE_ITEMS, name: MovingLoadCaseOptimizeItem, namespace: DbMovingLoadsTypes}
    - {path: ASL, name: MovingLoadCaseAustraliaHeavyLoadPlatform, namespace: DbMovingLoadsTypes}
