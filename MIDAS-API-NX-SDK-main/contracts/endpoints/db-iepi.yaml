# /db/IEPI
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products, verification status and the DELETE
# shape come from docs/coverage.json's live record and the measured /db/* DELETE
# behaviour, not from the manual's framing. safeToOmit is answered `true` only
# where a confirmed live payload actually omitted the field.
contractVersion: 1
id: db-iepi
endpoint: /db/IEPI
name: Ignore Elements for Pushover Initial Load
surface:
  className: IgnoreElementsForPushoverInitialLoad
  exportName: ignoreElementsForPushoverInitialLoad
  modulePath: [db, pushover]
  payloadTypeName: IgnoreElementsForPushoverInitialLoadPayload

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 14_DB_Pushover.md
    section: "3. `/db/IEPI` — Ignore Elements for Pushover Initial Load"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-read-sweep-2026-07-26
    - product: gen
      ref: db-read-sweep-2026-07-26

operations:
  - method: DELETE
    variant: per_id
    path: /db/IEPI/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: B_IGNORE
    description: >-
      비선형 해석 초기하중용 요소 무시 여부
    type: boolean
    requirement: optional
    documentedDefault: false
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual

sdkRules:
  - id: db-iepi-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-iepi-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 14_DB_Pushover.md line 1280
  table: Parameters
