manualDefects:
  - describes: field_name
    manualSays: >-
      /db/STAG's Specifications table lists the construction stage's own
      fields and no ordering index.
    actual: >-
      The record carries `NO`, an integer the server describes "
      Construction Stage NO.". It was read from a real cable-stayed bridge
      model on Civil NX on 2026-07-30 - one of six schema gaps that day's
      cross-model spot-checking found - and has been in
      src/midas_nx/db/construction_stage.py ever since. It never reached
      this contract. The same wire name is documented Read Only on
      /db/STLD and on all six /db/LCOM-*; requirement here stays
      `unstated`, because that is a claim those sections make about their
      own endpoints.
    evidence: >-
      Found by scripts/info_baseline.py --against-contracts on 2026-09-04,
      sweeping the 2026-09-03 /info capture against every contract. The
      manual was then searched in full for the name, not just this
      section. Also docs/live_verification_notes.md, 2026-07-30.
      Registered as MD-41.

sdkRules:
  - id: db-stag-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-stag-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

