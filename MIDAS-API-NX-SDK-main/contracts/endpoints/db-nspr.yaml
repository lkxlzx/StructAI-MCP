# /db/NSPR
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-nspr
endpoint: /db/NSPR
name: Point Spring
surface:
  className: PointSpring
  exportName: pointSpring
  modulePath: [db, boundary]
  payloadTypeName: PointSpringPayload
  nestedTypes:
    - {path: ITEMS, name: PointSpringItem, namespace: DbBoundaryTypes}

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 05_DB_Boundary.md
    section: "2. `/db/NSPR` — Point Spring"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-write-sweep-2026-08-27
    - product: gen
      ref: db-write-sweep-2026-08-27

operations:
  - method: DELETE
    variant: per_id
    path: /db/NSPR/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: ITEMS
    description: >-
      Point Spring (배열로 삽입)
    type: array
    items:
      type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: ID
        description: >-
          Serial Number
        type: integer
        requirement: optional
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(1)', not by
        # naming a path
      - key: TYPE
        description: >-
          Spring Type · "LINEAR" / "COMP" / "TENS" / "MULTI"
        type: string
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(2)', not by
        # naming a path
      - key: GROUP_NAME
        description: >-
          Boundary Group Name
        type: string
        requirement: optional
        documentedDefault: ""
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(3)', not by
        # naming a path
      - key: FormType
        description: >-
          Create Function Type · 0=점 스프링 함수, 1=면 스프링 함수
        type: integer
        requirement: optional
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(4)', not by
        # naming a path
      - key: SDR
        description: >-
          Spring Stiffness [SDx, SDy, SDz, SRx, SRy, SRz]
        type: array
        items:
          type: number
        minItems: 6
        maxItems: 6
        requirement: required
        condition: LINEAR 전용
        appliesWhen:
          - path: ITEMS.TYPE
            equals: LINEAR
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: F_S
        description: >-
          Fixed Option [SDx, SDy, SDz, SRx, SRy, SRz]
        type: array
        items:
          type: boolean
        minItems: 6
        maxItems: 6
        requirement: optional
        condition: LINEAR 전용
        appliesWhen:
          - path: ITEMS.TYPE
            equals: LINEAR
        documentedDefault: false
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: DAMPING
        description: Damping Constant 사용 여부
        type: boolean
        requirement: optional
        condition: LINEAR 전용
        appliesWhen:
          - path: ITEMS.TYPE
            equals: LINEAR
        documentedDefault: false
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: Cr
        description: >-
          Damping [Cx, Cy, Cz, CRx, CRy, CRz]
        type: array
        items:
          type: number
        minItems: 6
        maxItems: 6
        requirement: optional
        condition: LINEAR 전용
        appliesWhen:
          - path: ITEMS.TYPE
            equals: LINEAR
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: STIFF
        description: Stiffness
        type: number
        requirement: required
        condition: COMP(Compression-Only) / TENS(Tension-Only) 전용
        appliesWhen:
          - path: ITEMS.TYPE
            in: [COMP, TENS]
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: DIR
        description: >-
          Direction · Dx(+):0 / Dx(–):1 / Dy(+):2 / Dy(–):3 / Dz(+):4 / Dz(–):5 / Vector:6
        type: integer
        requirement: required
        condition: COMP(Compression-Only) / TENS(Tension-Only) 전용; MULTI(Multi-Linear) 전용
        appliesWhen:
          - path: ITEMS.TYPE
            in: [COMP, TENS, MULTI]
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: DV
        description: Normal Vector(DIR=6일 때)
        type: array
        items:
          type: number
        minItems: 3
        maxItems: 3
        requirement: optional
        condition: COMP(Compression-Only) / TENS(Tension-Only) 전용; MULTI(Multi-Linear) 전용; DIR=6일 때
        appliesWhen:
          - path: ITEMS.TYPE
            in: [COMP, TENS, MULTI]
          - path: ITEMS.DIR
            equals: 6
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: FUNCTION
        description: Force-Deformation 함수 ID(/db/MLFC에서 정의)
        type: integer
        requirement: required
        condition: MULTI(Multi-Linear) 전용
        appliesWhen:
          - path: ITEMS.TYPE
            equals: MULTI
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: EFFAREA
        description: Width of Frame
        type: number
        requirement: optional
        condition: By Surface Spring Function 전용(`FormType`=1일 때 공통 추가)
        appliesWhen:
          - path: ITEMS.FormType
            equals: 1
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: DK
        description: >-
          Modulus of Subgrade Reaction [Kx, Ky, Kz]
        type: array
        items:
          type: number
        minItems: 3
        maxItems: 3
        requirement: optional
        condition: By Surface Spring Function 전용(`FormType`=1일 때 공통 추가)
        appliesWhen:
          - path: ITEMS.FormType
            equals: 1
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual

sdkRules:
  - id: db-nspr-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-nspr-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 05_DB_Boundary.md line 157
  table: 요청 파라미터
