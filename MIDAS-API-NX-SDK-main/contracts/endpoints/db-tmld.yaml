# /db/TMLD
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-tmld
endpoint: /db/TMLD
name: Time Loads for Construction Stage
surface:
  className: TimeLoadConstructionStage
  exportName: timeLoadConstructionStage
  modulePath: [db, constructionStage]
  payloadTypeName: TimeLoadConstructionStagePayload
  nestedTypes:
    - {path: ITEMS, name: TimeLoadItem, namespace: DbConstructionStageTypes}

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 10_DB_Construction_Stage.md
    section: 3. /db/TMLD – Time Loads for Construction Stage
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-write-sweep-2026-07-29
    - product: gen
      ref: db-write-sweep-2026-07-29

operations:
  - method: DELETE
    variant: per_id
    path: /db/TMLD/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: ITEMS
    description: >-
      시공단계 시간 하중 목록
    type: array
    items:
      type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: ID
        description: >-
          일련번호
        type: integer
        requirement: optional
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(1)', not by
        # naming a path
      - key: GROUP_NAME
        description: >-
          하중 그룹명
        type: string
        requirement: optional
        documentedDefault: ""
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(2)', not by
        # naming a path
      - key: DAY
        description: >-
          시간 하중 (일)
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(3)', not by
        # naming a path

sdkRules:
  - id: db-tmld-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-tmld-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
