    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: ID
        description: >-
          Serial Number
        type: integer
        requirement: optional
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(1)', not by
        # naming a path
      - key: GROUP_NAME
        description: >-
          Boundary Group Name
        type: string
        requirement: optional
        documentedDefault: ""
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(2)', not by
        # naming a path
      - key: ELEM_TYPE
        description: >-
          Element Type · "FRAME" / "PLANAR(FACE)" / "PLANAR(EDGE)" / "SOLID"
        type: string
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(3)', not by
        # naming a path
      - key: EDGE_FACE
        description: >-
          Edge/Face 선택 · FRAME: Local x=2, y=0, z=1 · PLANAR/SOLID: Edge#1∼4=0∼3
        type: integer
        requirement: optional
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(4)', not by
        # naming a path
      - key: SPRING_TYPE
        description: >-
          Spring Type · 0=Linear, 1=Comp.-Only, 2=Tens.-Only
        type: integer
        requirement: optional
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
