      - key: MODULUS
        description: >-
          Modulus of Subgrade Reaction Ks
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(6)', not by
        # naming a path
      - key: WIDTH
        description: >-
          Width(FRAME 전용)
        type: number
        requirement: conditional
        condition: FRAME
        documentedDefault: null
