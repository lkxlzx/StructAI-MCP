# /db/MATL
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-matl
endpoint: /db/MATL
name: Material Properties
surface:
  className: Material
  exportName: material
  modulePath: [db, properties, material]
  payloadTypeName: MaterialPayload
  nestedTypes:
    - {path: PARAM, name: MaterialParam, namespace: DbPropertiesMaterialTypes}

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 04_DB_Properties.md
    section: "1. `/db/MATL`"
    url: https://support.midasuser.com/hc/en-us/articles/35807411331993
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-write-sweep-2026-07-22
    - product: gen
      ref: db-write-sweep-2026-07-22

operations:
  - method: DELETE
    variant: per_id
    path: /db/MATL/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: TYPE
    description: >-
      Material Type • Concrete: "CONC" • Steel: "STEEL" • SRC: "SRC" • Aluminum:
      "ALUMINUM" • User Defined: "USER"
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: NAME
    description: >-
      Material Name
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: HE_SPEC
    description: >-
      Specific Heat
    type: number
    requirement: optional
    documentedDefault: 0
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: HE_COND
    description: >-
      Heat Conduction
    type: number
    requirement: optional
    documentedDefault: 0
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: PLMT
    description: >-
      Plastic Material No.
    type: integer
    requirement: optional
    documentedDefault: 0
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: P_NAME
    description: >-
      Plastic Material Name
    type: string
    requirement: optional
    documentedDefault: ""
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: bMASS_DENS
    description: >-
      Use Mass Density
    type: boolean
    requirement: optional
    documentedDefault: false
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: DAMP_RAT
    description: >-
      Damping Ratio
    type: number
    requirement: optional
    documentedDefault: 0
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: PARAM
    description: >-
      Material Parameter
    type: array
    items:
      type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: P_TYPE
        description: >-
          Material Parameter Type • Standard: 1 • Isotropic: 2 • Orthotropic: 3
        type: integer
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'PARAM' by numbering it '(1)', not by
        # naming a path
      - key: STANDARD
        description: >-
          Standard Name
        type: string
        requirement: required
        condition: PARAM — P_TYPE = 1 (Standard / DB)
        appliesWhen:
          - path: PARAM.P_TYPE
            equals: 1
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: CODE
        description: >-
          Code Name
        type: string
        requirement: optional
        condition: PARAM — P_TYPE = 1 (Standard / DB)
        appliesWhen:
          - path: PARAM.P_TYPE
            equals: 1
        documentedDefault: ""
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: DB
        description: >-
          DB Name
        type: string
        requirement: required
        condition: PARAM — P_TYPE = 1 (Standard / DB)
        appliesWhen:
          - path: PARAM.P_TYPE
            equals: 1
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: bELAST
        description: >-
          Use Young's Modulus (User Option)
        type: boolean
        requirement: optional
        condition: PARAM — P_TYPE = 1 (Standard / DB)
        appliesWhen:
          - path: PARAM.P_TYPE
            equals: 1
        documentedDefault: false
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: ELAST
        description: >-
          Modulus of Elasticity
        type: number
        requirement: required
        condition: PARAM — P_TYPE = 2 (Isotropic / User)
        appliesWhen:
          - path: PARAM.P_TYPE
            equals: 2
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: POISN
        description: >-
          Poisson's Ratio
        type: number
        requirement: required
        condition: PARAM — P_TYPE = 2 (Isotropic / User)
        appliesWhen:
          - path: PARAM.P_TYPE
            equals: 2
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: THERMAL
        description: >-
          Thermal Coefficient
        type: number
        requirement: required
        condition: PARAM — P_TYPE = 2 (Isotropic / User)
        appliesWhen:
          - path: PARAM.P_TYPE
            equals: 2
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: DEN
        description: >-
          Weight Density
        type: number
        requirement: required
        condition: PARAM — P_TYPE = 2 (Isotropic / User); PARAM — P_TYPE = 3 (Orthotropic / User)
        appliesWhen:
          - path: PARAM.P_TYPE
            in:
              - 2
              - 3
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: MASS
        description: >-
          Mass Density
        type: number
        requirement: required
        condition: PARAM — P_TYPE = 2 (Isotropic / User); PARAM — P_TYPE = 3 (Orthotropic / User)
        appliesWhen:
          - path: PARAM.P_TYPE
            in:
              - 2
              - 3
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: ELAST_M
        description: >-
          Modulus of Elasticity (3 values)
        type: array
        items:
          type: number
        requirement: required
        condition: PARAM — P_TYPE = 3 (Orthotropic / User)
        appliesWhen:
          - path: PARAM.P_TYPE
            equals: 3
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: POISN_M
        description: >-
          Poisson's Ratio (3 values)
        type: array
        items:
          type: number
        requirement: required
        condition: PARAM — P_TYPE = 3 (Orthotropic / User)
        appliesWhen:
          - path: PARAM.P_TYPE
            equals: 3
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: THERMAL_M
        description: >-
          Thermal Coefficient (3 values)
        type: array
        items:
          type: number
        requirement: required
        condition: PARAM — P_TYPE = 3 (Orthotropic / User)
        appliesWhen:
          - path: PARAM.P_TYPE
            equals: 3
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: SHEAR_M
        description: >-
          Shear Modulus (3 values)
        type: array
        items:
          type: number
        requirement: required
        condition: PARAM — P_TYPE = 3 (Orthotropic / User)
        appliesWhen:
