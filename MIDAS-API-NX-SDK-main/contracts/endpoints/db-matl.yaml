            equals: 3
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual

manualDefects:
  - describes: field_value
    manualSays: >-
      The Specifications table types `PARAM` as `Object`.
    actual: >-
      The same section's JSON Schema declares `"PARAM": {"description":
      "Material Data", "type": "array"}`, and every Request Example in the
      section sends `"PARAM": [{...}]` - one entry per material parameter set.
      The Python SDK has typed it `List[MaterialParam]` since the endpoint was
      added.
    evidence: >-
      docs/manual_defects_register.md MD-11, found by comparing every parameter
      table's Value Type against the type its own section's JSON Schema declares
      - nine disagreements in the whole manual, of which this is one of the two
      that change the shape of the value rather than its numeric width.

sdkRules:
  - id: db-matl-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-matl-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 04_DB_Properties.md line 97
  table: Specifications
