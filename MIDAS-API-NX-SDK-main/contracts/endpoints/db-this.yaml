  # COMMON.iAMETHOD as the selector. Rows listed as "COMMON 추가 파라미터"
  # go in COMMON and the rest at record root, which is where GET /info
  # declares every one of them on both products and where the four
  # Request Bodies send them. A row several modes list is gated on all of
  # them. Measured 2026-09-22 (live_manual_feedback.py --case c5): the
  # Linear + Modal body round-trips on both products; the three Nonlinear
  # bodies are refused on Gen NX and the Direct Integration one on Civil
  # NX, on a scratch model without nonlinear properties, so no row is
  # corrected from them.


manualDefects:
  - describes: requiredness
    manualSays: >-
      COMMON's table marks iTHTYPE (1=Transient, 2=Periodic) Required with no
      condition.
    actual: >-
      Both Nonlinear + Static Request Bodies in the same section omit it, and
      Civil NX accepts them and stores iTHTYPE: 1. Gen NX refused those bodies
      for another reason on a model without nonlinear properties, so its
      answer is not known.
    evidence: >-
      scripts/live_manual_feedback.py --case c5, 2026-09-22;
      docs/live_verification_notes.md.

sdkRules:
  - id: db-this-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-this-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

