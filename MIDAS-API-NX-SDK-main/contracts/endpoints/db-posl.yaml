manualDefects:
  - describes: field_name
    manualSays: >-
      /db/POSL's Specifications table gives one shape for both products.
    actual: >-
      Eleven fields differ. Civil NX declares `DAMP_RATIO` and `SRF`; Gen NX
      declares `EPA`, `EPGAeff`, `IF`, `Kae`, `METHOD`, `RMF`, `SD1`, `SDS` and
      `USER_GROUP`. This is the widest split of the ten divergent endpoints
      after `/db/SPLC` and `/db/SBDO`, and it is the shape of the two products'
      seismic-parameter dialogs rather than a documentation slip. Seven of the
      Gen nine were already here untagged; the other four were in no contract.
    evidence: >-
      GET /info/db/POSL on both products, captured 2026-09-03, compared by
      scripts/info_baseline.py --divergence. Registered as MD-46.

sdkRules:
  - id: db-posl-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-posl-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

