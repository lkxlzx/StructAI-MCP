sdkRules:
  - id: ope-gsbg-reject-mutually-exclusive-batch-fields
    kind: reject_request
    appliesTo: [POST]
    fields: [BATCH_LIST, BRDG_GROUP, COMPONENTS, COMBINED_COMP, 7TH_DOF_TYPE]
    rejects: forbidden_combination
    reason: >-
      The manual explicitly forbids BRDG_GROUP, COMPONENTS, COMBINED_COMP, and
      7TH_DOF_TYPE when BATCH=true (including omission), and forbids BATCH_LIST
      when BATCH=false. This is a request prohibition, not an applicability hint.
    alternative: >-
      Send BATCH_LIST for batch export, or set BATCH=false and send the
      single-group fields instead.

