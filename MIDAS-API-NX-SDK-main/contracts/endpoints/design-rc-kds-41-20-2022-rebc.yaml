      note: >-
        This heading states a condition and a parent at once, so the table was
        first recorded twice - once merged here, where the heading's own `ELEMS`
        puts it and where the item table's row (3) declares the object, and once
        again as a variant gating on `CREATE_SUB_SECTION`. The variant was
        removed 2026-09-03: its three fields are these three, and a branch has
        to attach to the object holding its discriminator, which would have put
        `KEYS`, `TO` and `STRUCTURE_GROUP_NAME` beside `ELEMS` rather than
        inside it. The condition is not lost - `ELEMS` itself carries it as
        `requirement: conditional` with the matching `appliesWhen`.
