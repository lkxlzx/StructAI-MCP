      note: >-
        The heading states a condition (TYPE) and a destination (SLAVES[]) at once.
        Merged into the parent row, both tables' members became one SLAVES element
        requiring all four keys, which neither TYPE accepts; kept as variants of
        ITEMS.TYPE that each redeclare SLAVES, every branch carries only its own.
