        description: >-
          Independent Nodes
        type: array
        items:
          type: object
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        properties:
          - key: NODE_KEY
            description: >-
              Node ID
            type: integer
            requirement: required
            documentedDefault: null
            documentedOptional: false
            safeToOmit: unverified
