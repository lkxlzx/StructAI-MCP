# /db/MCON
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-mcon
endpoint: /db/MCON
name: Linear Constraints
surface:
  className: LinearConstraint
  exportName: linearConstraint
  modulePath: [db, boundary]
  payloadTypeName: LinearConstraintPayload
  nestedTypes:
    - {path: ITEMS, name: LinearConstraintItem, namespace: DbBoundaryTypes}
    - {path: ITEMS.SLAVES, name: LinearConstraintSlaveExplicit, namespace: DbBoundaryTypes, branch: [{path: TYPE, equals: EX}]}
    - {path: ITEMS.SLAVES, name: LinearConstraintSlaveWeighted, namespace: DbBoundaryTypes, branch: [{path: TYPE, equals: WD}]}

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 05_DB_Boundary.md
    section: "21. `/db/MCON` — Linear Constraints"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-write-sweep-2026-07-29
    - product: gen
      ref: db-write-sweep-2026-07-29

operations:
  - method: DELETE
    variant: per_id
    path: /db/MCON/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: ITEMS
    description: >-
      Linear Constraints (배열로 삽입)
    type: array
    items:
      type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: ID
        description: >-
          Serial Number
        type: integer
        requirement: optional
        documentedDefault: 0
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(1)', not by
        # naming a path
      - key: GROUP_NAME
        description: >-
          Load Group Name
        type: string
        requirement: optional
        documentedDefault: ""
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(2)', not by
        # naming a path
      - key: SLAVE_TYPE
        description: >-
          DOF of Constraint Node (6자리: DX∼RZ)
        type: string
        minLength: 6
        maxLength: 6
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(3)', not by
        # naming a path
      - key: TYPE
        description: >-
          Constraint Type · "EX"=Explicit, "WD"=Weighted Displacement
        type: string
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(4)', not by
        # naming a path
      - key: SLAVES
        description: >-
          Independent Nodes
        type: array
        items:
          type: object
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(5)', not by
        # naming a path
        # the main table gives SLAVES no child rows. Its members are the
        # two TYPE-specific tables below, and they differ - "EX" takes
        # NODE_KEY/COEFF/DOF, "WD" NODE_KEY/WEIGHT - so each variant declares
        # SLAVES with its own members. Until 2026-09-22 all four were merged into
        # this base row as required, which no request can satisfy, and the
        # variants put the same keys beside TYPE instead of inside SLAVES[].

