manualDefects:
  - describes: field_name
    manualSays: >-
      The /db/BMLD `ITEMS` entry has nineteen members, listed (1) to (19),
      and a `DIRECTION` enum of six axis names.
    actual: >-
      `GET /info/db/BMLD` declares three more on the same entry: `VX`,
      `VY` and `VZ`, numbers described "Vector X/Y/Z". Nothing in the
      section takes a vector. This contract records the three fields and
      no rule about when they apply: an /info schema states no branch, and
      whether they pair with some `DIRECTION` value the manual does not
      document is not something a schema can say.
    evidence: >-
      Found by scripts/info_baseline.py --against-contracts on 2026-09-04,
      sweeping the 2026-09-03 /info capture against every contract. The
      manual was then searched in full for the name, not just this
      section. The only VX in the manual belongs to a different endpoint's
      USERGRID/TRAJ grid points in 11_DB_Settlement_Misc_Loads.md, where
      it means a wave velocity. Registered as MD-41.

sdkRules:
  - id: db-bmld-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-bmld-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

