# /db/TDMF
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-tdmf
endpoint: /db/TDMF
name: Time Dependent Material – User Defined
surface:
  className: TimeDependentMaterialFunction
  exportName: timeDependentMaterialFunction
  modulePath: [db, properties, material]
  payloadTypeName: TimeDependentMaterialFunctionPayload
  nestedTypes:
    - {path: vDAY, name: TimeDependentMaterialFunctionValue, namespace: DbPropertiesMaterialTypes}

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 04_DB_Properties.md
    section: "5. `/db/TDMF`"
    url: https://support.midasuser.com/hc/en-us/articles/35807665049369
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-read-sweep-2026-08-16
    - product: gen
      ref: db-read-sweep-2026-08-16

operations:
  - method: DELETE
    variant: per_id
    path: /db/TDMF/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: NAME
    description: >-
      Material Function Name
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: FTYPE
    description: >-
      Material Function Type • Creep: "CREEP" • Shrinkage Strain: "SHRINK" •
      Relaxation: "RELAX"
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: SCALE
    description: >-
      Scale Factor
    type: number
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: DESC
    description: >-
      Description
    type: string
    requirement: optional
    documentedDefault: ""
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: vDAY
    description: >-
      Function Data (Array of {DAY, VALUE})
    type: array
    items:
      type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: DAY
        description: >-
          Time
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'vDAY' by numbering it '(1)', not by
        # naming a path
      - key: VALUE
        description: >-
          Value
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'vDAY' by numbering it '(2)', not by
        # naming a path
  - key: CTYPE
    description: >-
      Creep Type • Specific Creep: "SC" • Creep Function: "CF" • Creep
      Coefficient: "CC"
    type: string
    requirement: required
    condition: Creep only
    appliesWhen:
      - path: FTYPE
        equals: CREEP
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: RELAXATION
    description: >-
      Relaxation Time • Hour: 0 • Day: 1
    type: integer
    requirement: required
    condition: Relax only
    appliesWhen:
      - path: FTYPE
        equals: RELAX
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: ELAST
    description: >-
      Elast
    type: number
    requirement: unstated
    documentedDefault: null
    documentedOptional: null
    safeToOmit: unverified
    provenance: info_schema
    # RESOLVED: declared by /info and absent from the manual - the whole
    # manual was searched for the name, not just this section.
    # Chapter 4's Specifications table and the section's own JSON Schema both
    # list seven properties and this is not among them.

manualDefects:
  - describes: field_name
    manualSays: >-
      /db/TDMF has seven properties - `NAME`, `FTYPE`, `SCALE`, `CTYPE`,
      `DESC`, `RELAXATION`, `vDAY` - stated identically in the section's
      JSON Schema and its Specifications table.
    actual: >-
      `GET /info/db/TDMF` declares an eighth, `ELAST`, a number described
      " Elast". Worth more than an eighth row: a live POST of this
      section's own worked example has answered "Wrong Field" on both
      products since 2026-08-16 and was left unresolved for want of a
      fresh angle. A field the server declares and the example never sends
      is a candidate cause. It has not been tested, and this contract
      claims nothing about it.
    evidence: >-
      Found by scripts/info_baseline.py --against-contracts on 2026-09-04,
      sweeping the 2026-09-03 /info capture against every contract. The
      manual was then searched in full for the name, not just this
      section. Also docs/live_verification_notes.md, 2026-08-16.
      Registered as MD-41.

sdkRules:
  - id: db-tdmf-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-tdmf-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 04_DB_Properties.md line 367
  table: Specifications
