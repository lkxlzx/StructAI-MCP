manualDefects:
  - describes: field_value
    manualSays: >-
      The Specifications table types `AXIS_VECTOR` as `Number` with default 0.
    actual: >-
      The same section's JSON Schema declares `"AXIS_VECTOR": {"description":
      "Axis Vector", "type": "array", "items": {"type": "number"}}`, and the
      section's own Request Example sends `"AXIS_VECTOR": [0, 0, 0, 0, 0, 0]`.
      The Python SDK's `SectionBoundaryDataPayload` has always typed it
      `List[float]`; only the contract, and the npm payload generated from it,
      followed the table.
    evidence: >-
      docs/manual_defects_register.md MD-11, found by comparing every parameter
      table's Value Type against the type its own section's JSON Schema
      declares - nine disagreements in the whole manual, of which this and
      `/db/MATL`'s `PARAM` are the two that change the shape of the value
      rather than its numeric width.

sdkRules:
  - id: db-sbdo-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-sbdo-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

