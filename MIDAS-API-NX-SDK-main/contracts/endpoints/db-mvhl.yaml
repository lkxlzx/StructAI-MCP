# Each VEH_* object is selected by the record's MVLD_CODE - the country - and
# not by the STANDARD_CODE the section's headings name. Measured on Civil NX
# 2026-09-22 (docs/live_verification_notes.md, "/db/MVHL: MVLD_CODE picks the
# country object"): every printed country body stored under its own MVLD_CODE
# with its model's /db/MVCD code selected, the KSCE-LSD15 and China
# user-defined bodies with no STANDARD_CODE at all; Australia's heading value
# "AUSTRALIA" answered Wrong Field where its body's "ROAD TRAFFIC" stored,
# which is the name of that table's first group. STANDARD_CODE picks a
# standard within the country. The codes are the ones each printed body sends;
# 13, 8, 14, 16 and 3 stored, and Poland's 15 is unconfirmed (its body stored
# nothing under any MVLD_CODE from 1 to 20). Rows under a table's group
