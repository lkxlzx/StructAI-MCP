# /db/MLFC
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-mlfc
endpoint: /db/MLFC
name: Force-Deformation Function
surface:
  className: ForceDeformationFunction
  exportName: forceDeformationFunction
  modulePath: [db, boundary]
  payloadTypeName: ForceDeformationFunctionPayload
  nestedTypes:
    - {path: ITEMS, name: ForceDeformationFunctionItem, namespace: DbBoundaryTypes}

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 05_DB_Boundary.md
    section: "15. `/db/MLFC` — Force-Deformation Function"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-write-sweep-2026-08-16
    - product: gen
      ref: db-write-sweep-2026-08-16

operations:
  - method: DELETE
    variant: per_id
    path: /db/MLFC/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: NAME
    description: >-
      Function Name
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: TYPE
    description: >-
      Type · "FORCE" (힘-변위) / "MOMENT" (모멘트-회전각)
    type: string
    requirement: optional
    documentedDefault: MOMENT
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: SYMM
    description: >-
      Symmetric · true=대칭, false=비대칭
    type: boolean
    requirement: optional
    documentedDefault: false
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: FUNC_ID
    description: >-
      Function ID
    type: integer
    requirement: optional
    documentedDefault: 0
    documentedOptional: true
    safeToOmit: true
    omissionEvidence: >-
      scripts/live_crud_check.py's ForceDeformationFunction case completed a
      live create-read-update-delete round trip on gen and civil without this
      field in its payload. That is evidence the call is accepted, not that the
      resulting model is what an engineer wanted.
    provenance: manual
  - key: ITEMS
    description: >-
      Function Data (X=변위/회전, Y=힘/모멘트)
    type: array
    items:
      type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: X
        description: >-
          X-Axis (Displacement m / Radian)
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(1)', not by
        # naming a path
      - key: Y
        description: >-
          Y-Axis (Force kN / Moment kN·m)
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # RESOLVED: the manual nests this under 'ITEMS' by numbering it '(2)', not by
        # naming a path

sdkRules:
  - id: db-mlfc-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-mlfc-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 05_DB_Boundary.md line 1211
  table: 요청 파라미터
