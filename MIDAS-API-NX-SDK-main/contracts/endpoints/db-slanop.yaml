manualDefects:
  - describes: field_name
    manualSays: >-
      /db/SLANop's Parameters table gives the lane fields and one item array.
    actual: >-
      `GET /info/db/SLANop` declares two more properties: `OPT_STRADD`, a
      boolean described " BS Straddling Lane Boolean", and `CHINA_ITEMS`, an
      array of `{NODE_KEY, OFFSET, SPAN_LENGTH, SPAN_START}` with no description
      of its own. The endpoint is the moving-load-optimization lane, and the
      manual documents neither the BS straddling option nor a China-specific
      item list for it.
    evidence: >-
      GET /info/db/SLANop on Civil NX, captured 2026-09-03, against
      docs/manual/08_DB_Moving_Loads.md section 9. Registered as MD-45.

sdkRules:
  - id: db-slanop-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-slanop-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

