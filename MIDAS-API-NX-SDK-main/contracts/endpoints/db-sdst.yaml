sdkRules:
  - id: db-sdst-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-sdst-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 05_DB_Boundary.md line 1521
  table: 요청 파라미터
  missingColumns:
    - heading: 요청 파라미터
      line: 1521
      columns: [Default]
    - heading: "`SDST_HYS_MODEL` 별 하위 객체"
      line: 1533
      columns: [Default]
  structuralTables:
    - heading: "`SDST_HYS_MODEL` 별 하위 객체"
      line: 1533
      paths: [BL2, LY2, LY3, IK2]
      note: >-
        Recorded as unmerged until 2026-09-04, on the reading that the table
        "enumerates object keys but does not state a complete field-level
        discriminator". It does state one: its Model column gives the literal
        SDST_HYS_MODEL value for each row, and row 3 of the Specifications
        table lists the same four literals against the same four objects. What
        the table does not do is put the members in a Key column - they are in
        a 하위 필드 cell - which is why the parser saw four names and no
        members and this contract published four bare objects. Merged, with
        each object's gate kept as `appliesWhen` on SDST_HYS_MODEL.
  prose:
    - line: 1291
      quote: >-
        | (1) | Name | `"NAME"` | String | Required | ... | (6) | Type Number |
        `"TYPE_NUMBER"` | String | Required |  (section 16, /db/SDVI)
      paths: [COMMON.NAME, COMMON.DESC, COMMON.INPUT_METHOD, COMMON.COMPANY,
              COMMON.PRODUCT_NAME, COMMON.TYPE_NUMBER]
    - line: 1536
      quote: >-
        | `"BL2"` | `"BL2"` | `BETA`(Exponent in Unloading Stiffness
        Calculation) | ... | `"IK2"` | `"IK2"` | `GAMMA`(Isotropic Factor) |
      paths: [BL2.BETA, LY2.ALPHA2, LY2.THETA, LY3.ALPHA2, LY3.THETA,
              LY3.GAMMA, IK2.GAMMA]
