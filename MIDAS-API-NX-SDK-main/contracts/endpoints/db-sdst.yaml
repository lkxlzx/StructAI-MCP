    - {path: COMMON, name: SeismicDeviceCommon, namespace: DbBoundaryTypes}
    - {path: IK2, name: SeismicDeviceSteelDamperIK2, namespace: DbBoundaryTypes}
    - {path: LY2, name: SeismicDeviceSteelDamperLY2, namespace: DbBoundaryTypes}
