manualDefects:
  - describes: field_name
    manualSays: >-
      The Specifications table and the section's own JSON Schema give the
      `ITEMS` entry twelve fields: `CREATE_SUB_WALL_ID`, `SUB_WALL_ID`,
      `STORY: {FROM, TO}`, `VERTICAL_REBAR`, `HORIZONTAL_REBAR`,
      `USE_END_REBAR`, `END_REBAR: {NAME, NUM, DIST}`, `BE_HORIZONTAL_REBAR`,
      `BOUNDARY_ELEMENT_LENGTH`, `CONCRETE_FACE_TO_CENTER_OF_REBAR: {DW, DE}`,
      `USE_MODEL_THICKNESS` and `THICKNESS`.
    actual: >-
      The server implements none of them. It answers to `ID`,
      `bUSE_MODEL_THICK`, `THICK`, top-level `DW` and `DE`, `VER_BAR`,
      `HOR_BAR`, `END_BAR`, `NUM_END_BAR`, `BE_HOR_BAR`, `BE_LENGTH` and
      `vSTORY_NAME`. Two of the differences are structural rather than
      cosmetic: the two rebar-centre distances are top-level and not members of
      an object, and stories are a flat name list rather than a `{FROM, TO}`
      range. `CREATE_SUB_WALL_ID` and `SUB_WALL_ID` have no counterpart at all.
      This is the whole payload contract, not a drift - a caller following the
      documented example has every field ignored or rejected.
    evidence: >-
      docs/live_verification_notes.md, "/db/REBW's manual section doesn't match
      the live server at all" (2026-07-29). Three independent confirmations
      against one production Gen NX model with 102 populated rows: a GET that
      returned the names below, GET /info/db/REBW declaring them as the
      server's own Argument schema, and a PUT round trip on wall 101 that
      changed VER_BAR.DIST, verified it, and restored it. The sibling /db/REBB
      and the ch26 /DESIGN/RC/KDS-41-20-2022/REBW - the same 102 walls - both
      matched their own documentation exactly in that session, which is what
      isolates this to one section.
    reportedToVendor: B-5
  - describes: behaviour
    manualSays: >-
      Nothing about where this documentation came from - the chapter reads as a
      faithful transcription, and this repo's own drift checker treats it as
      one.
    actual: >-
      The defect is upstream of the vendored repo. MIDASIT's own Zendesk
      article for this endpoint, 59359110968345 "Modify Wall Rebar Data",
      documents the same long-form names, so the vendored chapter transcribes
      its source correctly and the source does not match its own server. That
      matters for who can fix it: the manual repo cannot correct this one on
      its own the way it corrects a transcription slip.
    evidence: >-
      The article fetched directly through the Zendesk Help Center JSON API on
      2026-07-29, recorded in docs/live_verification_notes.md. Distinct from
      59236271208729, the ch26 KDS article, which is correct.
    reportedToVendor: B-5

sdkRules:
  - id: db-rebw-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-rebw-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog. Wall rebar is design input a caller cannot
      reconstruct from the model geometry.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 24_DB_Design.md line 1
  table: none
  note: >-
    No table. The extractor's draft was discarded rather than reviewed: it
    transcribed a Specifications table that describes a schema the server does
    not implement, so promoting any part of it would have put the defect into
    the source of truth. The fields here come from GET /info/db/REBW,
    corroborated by a GET of real data and a PUT round trip - the two permitted
    sources that remain when the manual is the thing that is wrong.
