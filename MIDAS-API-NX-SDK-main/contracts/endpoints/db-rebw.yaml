            provenance: live_corrected
          - key: DIST
            description: >-
              Space
            type: number
            requirement: unstated
            documentedDefault: null
            documentedOptional: null
            safeToOmit: unverified
            provenance: live_corrected
      - key: HOR_BAR
        description: >-
          Horizontal Rebar
        type: object
        requirement: unstated
        documentedDefault: null
        documentedOptional: null
        safeToOmit: unverified
        provenance: live_corrected
        provenanceNote: The manual's `HORIZONTAL_REBAR`.
        properties:
          - key: NAME
            description: >-
              Name
            type: string
            requirement: unstated
            documentedDefault: null
            documentedOptional: null
            safeToOmit: unverified
            provenance: live_corrected
          - key: DIST
            description: >-
              Space
            type: number
            requirement: unstated
            documentedDefault: null
            documentedOptional: null
