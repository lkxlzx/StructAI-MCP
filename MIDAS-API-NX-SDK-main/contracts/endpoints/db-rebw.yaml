# /db/REBW
#
# The one contract in this directory whose fields come from no manual at all.
# Every field name in the section's Specifications table and JSON Schema is
# wrong - not drifted, wrong - and that was confirmed three ways against a real
# production Gen NX model with 102 populated wall-rebar rows, then against
# MIDASIT's own Zendesk article rather than the vendored copy. What is written
# here is the server's own schema, corroborated by a GET of real data and by a
# PUT round trip that changed a value, verified it, and restored it.
#
# The sibling endpoints rule out a family-wide problem: /db/REBB in the same
# chapter and /DESIGN/RC/KDS-41-20-2022/REBW - the ch26 endpoint for the same
# physical walls, the same 102 rows - both matched their own documentation
# exactly in the same session.
contractVersion: 1
id: db-rebw
endpoint: /db/REBW
name: Modify Wall Rebar
surface:
  className: WallRebar
  exportName: wallRebar
  modulePath: [db, design]
  payloadTypeName: WallRebarPayload
  nestedTypes:
    - {path: ITEMS, name: WallRebarItem, namespace: DbDesignTypes}
    - {path: ITEMS.BE_HOR_BAR, name: RebarNameDist, namespace: DbDesignTypes}
    - {path: ITEMS.END_BAR, name: RebarNameDist, namespace: DbDesignTypes}
    - {path: ITEMS.HOR_BAR, name: RebarNameDist, namespace: DbDesignTypes}
    - {path: ITEMS.VER_BAR, name: RebarNameDist, namespace: DbDesignTypes}

products: [gen]
productsEvidence: >-
  Gen only, and not because the manual frames it that way. Both the route and
  GET /info/db/REBW 404 on Civil NX, confirmed independently twice on
  2026-07-29. Recorded in db/base.py's GEN_ONLY.

recordKey:
  kind: record_id
  description: >-
    The wall id. The 2026-07-29 round trip addressed wall 101 by this key and
    the change landed on exactly that wall.

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 24_DB_Design.md
    section: "12. `/db/REBW` — Modify Wall Rebar Data (벽체 철근 데이터 수정)"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_gen
  records:
    - product: gen
      ref: db-rebw-live-shape-2026-07-29

operations:
  - method: DELETE
    variant: per_id
    path: /db/REBW/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      What made the defect visible. Against a model with real wall rebar in it,
      the response carried none of the documented field names and all of the
      ones below.
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Round-tripped live on 2026-07-29 against wall 101 of a production model:
      VER_BAR.DIST changed 0.2 to 0.99, confirmed on a fresh GET, then restored
      and confirmed byte-for-byte. That is what makes these names the write
      contract and not only the read shape.

fields:
  - key: ITEMS
    description: >-
      Concrete Wall Rebar Items
    type: array
    items:
      type: object
    minItems: 1
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: live_verified
    provenanceNote: >-
      The only thing the manual and the server agree on for this endpoint: the
      payload is an ITEMS array. Everything inside it is live_corrected.
    properties:
      - key: ID
        description: >-
          ID
        type: integer
        requirement: unstated
        documentedDefault: null
        documentedOptional: null
        safeToOmit: unverified
        provenance: live_corrected
      - key: bUSE_MODEL_THICK
        description: >-
          Use Model Thickness
        type: boolean
        requirement: unstated
        documentedDefault: null
        documentedOptional: null
        safeToOmit: unverified
        provenance: live_corrected
        provenanceNote: >-
          The manual's `USE_MODEL_THICKNESS`, which the server does not answer
          to.
      - key: THICK
        description: >-
          Thickness (Input check-off Use Model Thickness)
        type: number
        requirement: unstated
        documentedDefault: null
        documentedOptional: null
        safeToOmit: unverified
        provenance: live_corrected
        provenanceNote: >-
          The description is the server's own, verbatim, and it reads as a
          condition on `bUSE_MODEL_THICK`. It is not recorded as one: an /info
          schema states no branch anywhere and declares no required array, so
          turning a description into an `appliesWhen` would be this contract
          inventing a gate rather than transcribing one. The manual's
          `THICKNESS` is the name that does not work.
      - key: DW
        description: >-
          Dw (Concrete Face ~ Rebar Center)
        type: number
        requirement: unstated
        documentedDefault: null
        documentedOptional: null
        safeToOmit: unverified
        provenance: live_corrected
        provenanceNote: >-
          Top level. The manual nests both distances inside a
          `CONCRETE_FACE_TO_CENTER_OF_REBAR` object that the server does not
          have.
      - key: DE
        description: >-
          De (Concrete Face ~ Rebar Center)
        type: number
        requirement: unstated
        documentedDefault: null
        documentedOptional: null
        safeToOmit: unverified
        provenance: live_corrected
      - key: VER_BAR
