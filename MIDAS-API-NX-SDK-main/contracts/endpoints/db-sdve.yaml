manualDefects:
  - describes: field_name
    manualSays: >-
      Row 1 of the Specifications table is `Common Data (SDVI와 동일 구조)`, an
      Object marked Required, and the table gives it no members.
    actual: >-
      The members are six, numbered (1) to (6) under /db/SDVI in section
      16 of the same chapter, which this row names outright as the shared
      structure. `GET /info/db/SDVE` declares exactly those six on both
      products. The extractor cannot follow a cross-reference, which is
      why the object was published with no members at all until
      2026-09-04. src/midas_nx/db/boundary.py has had them the whole time,
      as `SeismicDeviceCommon`; this is a contract that was behind its own
      SDK. One thing the cross-reference does not settle: /db/SDVI's table
      marks `COMPANY` Required while this section's own Request Example
      omits it. The table is what this contract records, and `safeToOmit`
      stays unverified.
    evidence: >-
      Found by scripts/info_baseline.py --against-contracts on 2026-09-04,
      sweeping the 2026-09-03 /info capture against every contract. The
      manual was then searched in full for the name, not just this
      section. docs/manual/05_DB_Boundary.md sections 16 and 17.
      Registered as MD-41.

sdkRules:
  - id: db-sdve-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-sdve-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

