sdkRules:
  - id: db-lcom-steel-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-lcom-steel-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

manualDefects:
  - describes: field_name
    manualSays: >-
      The Parameters table names six fields, and the chapter's own
      "LCOM 타입별 비교 요약" table states this endpoint's 추가 필드 as none at all (an em dash).
    actual: >-
      `GET /info/db/LCOM-STEEL` declares four more on both Civil and Gen: `bES`
      ("E (Concrete design only)"), `iSERV_TYPE` ("EC Serv Type"), `nLCOMTYPE`
      ("EC Lcom Type") and `nSEISTYPE` ("EC Seis Type"). The same four appear on
      all six `/db/LCOM-*` endpoints, so the summary table's per-endpoint 추가 필드
      column does not describe what the server accepts. Recorded `unstated`, not
      `optional`: /info declares no `required` array and the manual makes no
      claim about these fields at all. Same shape as MD-10 and MD-22.
    evidence: >-
      GET /info/db/LCOM-STEEL on Civil NX and Gen NX, captured 2026-09-03 in the full
      /info sweep, against docs/manual/13_DB_Load_Combinations.md's Parameters
      table for this section and its "LCOM 타입별 비교 요약" table. Registered as
      MD-35.

