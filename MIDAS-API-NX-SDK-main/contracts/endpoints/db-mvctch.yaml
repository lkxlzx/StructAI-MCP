manualDefects:
  - describes: field_name
    manualSays: >-
      Section 10's "FREQ 객체 주요 키" table is laid out as two Key/설명
      column pairs side by side, and it documents all 25 of the object's keys
      between them.
    actual: >-
      The manual is right and this repo could not read it. Every key in the
      table's *second* Key column was dropped whole - `SBEM_L`, `SBEM_E`,
      `SBEM_IC`, `SBEM_MC` (단순보), `iARCH_TYPE` (아치교 형식) and `CABL_A`,
      `CABL_L` (사장교) - while the first column's cells extracted correctly,
      packed ones included. So this is not MD-48's packed Key cell: it is a
      table shape the parser reads half of. `GET /info/db/MVCTch` declares all
      seven and they are transcribed here from the manual.
    evidence: >-
      docs/manual/12_DB_Analysis_Control.md line 1121 for the table, and
      GET /info/db/MVCTch on both products, captured 2026-09-03, which agrees
      with it. Registered as MD-50.

  - describes: field_name
    manualSays: >-
      `BRIDGE1` and `BRIDGE2` each have a field table with no `BTYPE` row.
    actual: >-
      Each object's `BTYPE` is stated in the bold sentence that introduces its
      table rather than in a row of it - "BRIDGE1 객체 — `\"BTYPE\"`(Bridge
      Type: `\"RC\"` / `\"STEEL\"` / ...)별 필드" - together with the enum
      each accepts. It is the selector that decides which of that table's
      fields apply, so a caller cannot use either object without it. Recorded
      under extraction.prose with the sentence quoted.
    evidence: >-
      docs/manual/12_DB_Analysis_Control.md lines 1130 and 1153, and
      GET /info/db/MVCTch on both products, captured 2026-09-03, which
      declares `BTYPE` on both objects. Registered as MD-50.
sdkRules:
  - id: db-mvctch-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-mvctch-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

