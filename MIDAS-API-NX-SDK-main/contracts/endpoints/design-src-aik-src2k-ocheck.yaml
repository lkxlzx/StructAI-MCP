knownDefects:
  - ref: temp-src-ocheck-ends-the-session
sdkRules:
  - id: temp-src-ocheck-unofficial-and-unsafe
    kind: warn
    appliesTo: [POST]
    reason: >-
      This route ends the NX session whenever the open model holds a section SRC
      design cannot use, which is the normal case in a real model. It has been
      reproduced four times across two products and four builds, each needing a
      full product restart, and MIDASIT has classified the endpoint as unofficial
      with paused development - which is what the /TEMP/ prefix in its URL means.
      A caller has to be told before the call, not after: there is no error to
      catch, only a timeout and a dead session.
    riskRef: temp-src-ocheck-ends-the-session
    alternative: >-
      None through this API. Run the optimal design from the product UI, or use
      /DESIGN/SRC/AIK-SRC2K/CC-ANAL and BC-ANAL to check sections you have chosen
      yourself.
manualDefects:
  - describes: behaviour
    manualSays: >-
      Section 21 gives the Input URI as `{base url}/DESIGN/SRC/AIK-SRC2K/OCHECK`
      and documents the endpoint alongside the chapter's supported routes,
      saying nothing about its status.
    actual: >-
      That path returns a clean 404. MIDASIT moved the route to
      `/TEMP/DESIGN/SRC/AIK-SRC2K/OCHECK` on 2026-08-06 to mark it as an
      unofficial API whose development is paused, and confirmed that the move is
      the status marker rather than a fix. The route still ends the NX session
      when the model holds a section SRC design cannot use - reproduced on the
      /TEMP/ path on 2026-08-07 (Gen), 2026-08-13 and 2026-08-24 (Civil), across
      four builds, each time requiring a full product restart. So the manual is
      wrong twice over about the same endpoint: the URL it prints does not
      answer, and the one that does answer is not safe to call.
    evidence: >-
      docs/live_verification_notes.md and docs/coverage.json's entry for
      /TEMP/DESIGN/SRC/AIK-SRC2K/OCHECK, which records all four reproductions
      with builds and recovery steps. Registered as MD-32.

