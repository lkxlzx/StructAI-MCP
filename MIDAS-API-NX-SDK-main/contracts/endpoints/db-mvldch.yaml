# /db/MVLDch – Moving Load Cases – China
#
# Sources: docs/manual/08_DB_Moving_Loads.md #13 plus paired Civil/Gen route
# and /info verification in docs/live_verification_notes.md. Neither SDK was
# used to establish the contract facts below.
contractVersion: 1
id: db-mvldch
endpoint: /db/MVLDch
name: Moving Load Cases – China
surface:
  className: MovingLoadCaseChina
  exportName: movingLoadCaseChina
  modulePath: [db, movingLoads]
  payloadTypeName: MovingLoadCaseChinaPayload
  nestedTypes:
    - {path: SUB_LOAD_ITEMS, name: MovingLoadCaseChinaSubLoadItem, namespace: DbMovingLoadsTypes}
    - {path: AUTO_OPTIMIZE_ITEMS, name: MovingLoadCaseChinaOptimizeItem, namespace: DbMovingLoadsTypes}
summary: >-
  Defines China moving-load cases. The request has distinct general-load and
  moving-load-optimization payload branches selected by OPT_AUTO_OPTIMIZE.

products: [gen, civil]
productsEvidence: >-
  Both products answered the paired route sweep; Gen NX also returned a full
  /info schema for this endpoint.

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 08_DB_Moving_Loads.md
    section: 13. /db/MVLDch – Moving Load Cases – China
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: gen
      ref: db-mvldch-product-support-2026-07-29
    - product: civil
      ref: db-mvldch-product-support-2026-07-29

operations:
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: unknown
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: unknown
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: unknown
  - method: DELETE
    variant: per_id
    path: /db/MVLDch/{id}
    risk: destructive
    mitigation: none
    request:
      wrapper: none
    response:
      wrapper: unknown
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    request:
      wrapper: assign
      itemSchema: none
    response:
      wrapper: unknown
    notes: >-
      The documented bare-endpoint DELETE form ignores ids and empties the
      table; use the per-id route for a selected case.

