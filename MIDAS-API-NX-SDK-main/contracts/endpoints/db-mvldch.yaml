sdkRules:
  - id: mvldch-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The documented bare-endpoint DELETE body ignores named ids and empties the
      whole table. The per-id route is the selective-delete form for /db resources.
    riskRef: db-delete-body-empties-table
    alternative: Use whole_table only when deleting every moving-load case is intended.
  - id: mvldch-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: Emptying all China moving-load cases is destructive.
    riskRef: db-delete-body-empties-table
    alternative: Use per_id DELETE for selected moving-load cases.

knownDefects:
  - ref: db-delete-body-empties-table

manualDefects:
  - describes: behaviour
    manualSays: DELETE /db/MVLDch with an ID-keyed Assign body deletes the named case.
    actual: >-
      The bare-endpoint DELETE body ignores ids and empties the table; the
      undocumented /db/MVLDch/{id} path is the selective-delete form.
    evidence: docs/live_verification_notes.md.

extraction:
