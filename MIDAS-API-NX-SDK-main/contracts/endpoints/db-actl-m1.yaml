manualDefects:
  - describes: field_name
    manualSays: >-
      The `CONVERGENCE` sub-table has two rows, `OPT_USE` and `VALUE`.
    actual: >-
      They belong to each of three children. The sub-table's own heading says
      so - "CONVERGENCE 객체 - DISPL(변위 U) / LOAD(하중 P) / WORK(일 W) 각각" -
      and the section's Request Body sends
      `{"DISPL": {...}, "LOAD": {...}, "WORK": {...}}`. `GET /info/db/ACTL-M1`
      declares the same three. This contract had both rows hanging straight off
      `CONVERGENCE` until 2026-09-04, one level short of where the server looks.
      The manual states it; a heading that names three children and a table that
      describes all of them is a form the extractor does not read.
    evidence: >-
      GET /info/db/ACTL-M1 on Civil NX, captured 2026-09-03, against
      docs/manual/12_DB_Analysis_Control.md lines 158-200. Registered as MD-44.

sdkRules:
  - id: db-actl-m1-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-actl-m1-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
