manualDefects:
  - describes: field_name
    manualSays: >-
      Row 1-6 declares `MESHER.INCLUDE_INTERIOR_LINES` and then lists none of
      its members, writing "구조는 1-5와 동일" in the description instead. The
      table therefore names three fields fewer than the request has.
    actual: >-
      The three are `OPT_CHECK`, `OPTION` and `VALUE`, exactly as rows 1-5-a to
      1-5-c give them for the sibling `INCLUDE_INTERIOR_NODES`. The section's own
      JSON Schema declares the identical trio under `INCLUDE_INTERIOR_LINES`, and
      its second Request Example sends
      `"INCLUDE_INTERIOR_LINES": { "OPT_CHECK": true, "OPTION": "User", "VALUE": [2] }`.
      Transcribed here from those rows rather than left out, because a payload
      type built from the table alone would refuse a call the manual itself
      prints. `VALUE`'s condition is rooted on this object's own `OPTION`, not on
      the sibling's. Same shape as MD-26 and MD-22: members the table has no rows
      for, supplied by a second statement in the same section.
    evidence: >-
      docs/manual/15_OPE.md section 6's Parameters row 1-6 against rows 1-5-a to
      1-5-c, the JSON Schema printed above them, and the second POST Request Body
      below them. Registered as MD-28.
  - describes: requiredness
    manualSays: >-
      Rows 2-1 and 2-2 both mark `MESH_SIZE.LENGTH` and `MESH_SIZE.DIV`
      **Required**, while each row's own description says the two cannot be
      used together (`DIV`와 동시 사용 불가 / `LENGTH`와 동시 사용 불가).
    actual: >-
      They are alternatives, and no payload can satisfy both cells. The
      section's own two Request Examples send exactly one each -
      `"MESH_SIZE": { "LENGTH": 1 }` and `"MESH_SIZE": { "DIV": 3 }` - so a
      caller following the Required column literally would be sending a request
      the manual's own examples contradict. Recorded `conditional` with each
      row's phrase as the condition and no `appliesWhen`: the manual names no
      discriminator field, because which one to send is the caller's modelling
      choice, not a branch the payload declares. `documentedOptional` stays
      false - the manual does say Required, and that is what the flag records.
    evidence: >-
      docs/manual/15_OPE.md section 6's Parameters rows 2-1 and 2-2 against the
      two POST Request Bodies printed below them in the same section.
      Registered as MD-28.
  - describes: field_value
    manualSays: >-
      The Parameters table types both `MESH_SIZE.LENGTH` and `MESH_SIZE.DIV`
      Number; the section's own JSON Schema types both `integer`.
    actual: >-
      The two fields do not resolve the same way, and the difference is in what
      each names. `DIV` is 분할수 - a division count - so `integer` is kept: it
      is the narrower of the two documented types and the Request Example's
      `3` satisfies both readings, so narrowing costs nothing. `LENGTH` is a
      mesh size in model length units, and `integer` would exclude values the
      row's own description admits, with no third statement to support it, so
      the table's `Number` is kept there. Related to MD-27, which resolved five
      of these in one direction because all five were counts.
    evidence: >-
      docs/manual/15_OPE.md section 6's Parameters rows 2-1 and 2-2 against the
      JSON Schema printed above them in the same section. Registered as MD-28.

