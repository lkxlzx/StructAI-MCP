manualDefects:
  - describes: field_name
    manualSays: >-
      /db/LLANtr's record is `LL_NAME` and `LANE_ITEMS`.
    actual: >-
      `GET /info/db/LLANtr` declares a third property, `SPECIAL_LANE_ITEMS`, an
      array of `{ELEMS, FACTOR}` described " Used only when importing". That
      description is the whole of what is known about when it applies; no
      contract rule is written from it.
    evidence: >-
      GET /info/db/LLANtr on Civil NX, captured 2026-09-03, against
      docs/manual/08_DB_Moving_Loads.md section 5. Registered as MD-45.

sdkRules:
  - id: db-llantr-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-llantr-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
