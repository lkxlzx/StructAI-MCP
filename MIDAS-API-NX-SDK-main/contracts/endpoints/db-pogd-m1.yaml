manualDefects:
  - describes: field_name
    manualSays: >-
      The Beam/Column checkbox under `ANALYSIS_STOP.AXIAL_YIELD` is
      `"BEAM"`, and the Uplifting checkbox under
      `ANALYSIS_STOP.SUPPORT_DZ_DIR` is `"UPLIFT"`.
    actual: >-
      `GET /info/db/POGD-M1` declares `BEAM_COLUMN` and `UPLIFTING`. The first
      is contradicted by the manual itself: the sibling `SHEAR_YIELD` group,
      four rows earlier in the same table, spells the same checkbox
      `BEAM_COLUMN`. The second is stated as `UPLIFT` in six places - the JSON
      Schema, both `allOf` cross-field rules, the Specifications table, the
      request and response examples and the Python example - which is
      consistency within the section, not evidence about the server.
    evidence: >-
      GET /info/db/POGD-M1 on Civil NX, captured 2026-09-03 in the full /info
      sweep, against docs/manual/14_DB_Pushover.md section 2 (lines 596-660 and
      the Specifications rows 5-1-b, 5-2-b and 5-3-b). Registered as MD-37.
  - describes: field_name
    manualSays: >-
      `ANALYSIS_STOP.SHEAR_YIELD.WALL` and `ANALYSIS_STOP.AXIAL_YIELD.WALL`
      exist, and both `allOf` rules make one of them a legal way to satisfy
      `OPT_USE: true`.
    actual: >-
      `GET /info/db/POGD-M1` declares no `WALL` property in either group.
      `SHEAR_YIELD` has `OPT_USE` and `BEAM_COLUMN`; `AXIAL_YIELD` has
      `OPT_USE`, `BEAM_COLUMN` and `TRUSS`. Both fields are nonetheless kept.
      An /info schema is evidence about what the server declares, and
      /db/STBK shows that is not the same as what it accepts: `LCNAME` is
      declared by neither product's schema there, and scripts/live_crud_check.py
      runs a confirmed create-read-update-delete round trip sending it on both.
      So absence from /info supports a note, not a removal. What settled
      `/db/REBR` and `/db/REBC` was different in kind - a live POST comparison
      where the documented shape was refused outright.
    evidence: >-
      GET /info/db/POGD-M1 on Civil NX, captured 2026-09-03, against
      docs/manual/14_DB_Pushover.md Specifications rows 5-1-c and 5-2-c and the
      JSON Schema's allOf blocks at lines 596-616. Registered as MD-37.
  - describes: field_name
    manualSays: >-
      `PO_HINGE_OPT.BILINEAR.SYMMETRIC` and `PO_HINGE_OPT.TRILINEAR.SYMMETRIC`
      are Required, and the manual's own JSON Schema lists `SYMMETRIC` in both
      `required` arrays.
    actual: >-
      `GET /info/db/POGD-M1` declares neither. `BILINEAR` has `COMP_A1` and
      `TENS_A1`; `TRILINEAR` has those plus `COMP_A2` and `TENS_A2`. Kept for
      the reason given on `WALL` above, and with more reason: dropping a field
      the manual marks Required, and lists in its own JSON Schema's `required`
      array, would break every caller who follows the documentation, on the
      strength of a schema that has already been shown incomplete elsewhere.
    evidence: >-
      GET /info/db/POGD-M1 on Civil NX, captured 2026-09-03, against
      docs/manual/14_DB_Pushover.md lines 897-914 and Specifications rows 7-2-e
      and 7-3-c. Registered as MD-37.

sdkRules:
  - id: db-pogd-m1-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-pogd-m1-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

