    # Gen NX only. The section describes one endpoint for both products and
    # says nothing about either; the `products` tag is a measurement from
    # /info, not a documentation claim. See MD-46.

manualDefects:
  - describes: field_name
    manualSays: >-
      /db/ACTL's Specifications table lists the analysis control options, and
      makes no distinction between the two products.
    actual: >-
      `GET /info/db/ACTL` declares `ACWC` (" Auto Constraint for Wall Elements
      Connectivity") on Gen NX and not on Civil NX, and `CLATS` on Civil NX and
      not on Gen NX. The table gives both products one shape. `CLATS` was
      already in this contract, untagged - a claim that Civil's field is also
      Gen's.
    evidence: >-
      GET /info/db/ACTL on both products, captured 2026-09-03, compared by
      scripts/info_baseline.py --divergence. Registered as MD-46.

sdkRules:
  - id: db-actl-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-actl-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 12_DB_Analysis_Control.md line 57
