name: Publish JavaScript and TypeScript to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'js-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm CLI supports Trusted Publishing
        run: npm install --global "npm@^11.5.1"
      # The dev extra, not the bare install: this job re-runs `npm run generate`
      # before publishing, and generation reads the endpoint safety rules out of
      # contracts/, which needs PyYAML. The generator refuses to run without it
      # rather than publishing a package with those rules silently missing.
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: packages/typescript

      - name: Fail if the release tag does not match package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        working-directory: packages/typescript
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#js-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package.json ${pkg}" >&2
            exit 1
          fi
          echo "tag ${RELEASE_TAG} matches package.json ${pkg}"

      - run: npm run generate
        working-directory: packages/typescript
      - name: Fail if generated TypeScript files drifted
        run: git diff --exit-code -- schema/typescript-resources.json schema/typescript-coverage.json packages/typescript/src/generated
      - run: npm run typecheck
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript
      - run: npm run build
        working-directory: packages/typescript

      - name: Verify safety JSDoc reached the published declarations
        run: |
          grep -q "WARNING: Confirmed crashing Gen NX" packages/typescript/dist/index.d.ts
          grep -q "A timeout is not a rollback" packages/typescript/dist/index.d.ts

      - run: npm pack --dry-run
        working-directory: packages/typescript
      - run: npm publish --access public
        working-directory: packages/typescript
