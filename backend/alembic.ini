# Alembic configuration for the StructAI persistence layer.
#
# The database URL is NOT set here: migrations/env.py pulls it from
# app.core.config.get_settings().database_url so that the ORM, the seeder and
# Alembic can never disagree about the target database.
#
# The initial schema is delivered by sql/001_schema.sql (V2.1 §4 verbatim), not
# by a hand-written revision. Use `alembic revision --autogenerate` only for
# *subsequent* schema changes.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is injected at runtime by migrations/env.py.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
